function showGoogleSetup(){showModal('Google sign-in & secure device sync',`<div class="role-banner"><span class="google-g">G</span><div><strong>Google authentication via Supabase</strong><small>Authenticate staff and sync their assigned store across physical devices.</small></div></div><div class="sync-banner" style="margin-top:12px"><i class="fa-solid fa-shield-halved"></i><div>The POS backend and row-level access rules are installed. Google sign-in will work after the OAuth Web Client ID and Client Secret are configured for this Supabase project.</div></div><div class="field"><label>Supabase project</label><input value="https://tjjvdsjrdjzqszzdtosk.supabase.co" disabled /></div><div class="field"><label>Google OAuth callback URI</label><input value="https://tjjvdsjrdjzqszzdtosk.supabase.co/auth/v1/callback" readonly /></div><div class="stat-line"><span>Cloud database / access rules</span><strong>Configured</strong></div><div class="stat-line"><span>Google OAuth provider</span><strong>${window.MYPOS_CLOUD?.active?'Connected':'Needs Google client credentials'}</strong></div><p class="muted small">The browser uses only a publishable key. Do not enter a service-role key or Google Client Secret into the POS app.</p>`,`<button class="btn" data-action="close-modal">Close</button><button class="btn btn-primary" data-action="cloud-google-signin">${icon('google')} Continue with Google</button><button class="btn" data-action="google-setup-guide">Setup checklist</button>`,true)}
function showModal(title,content,footer='',wide=false){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="modal-head"><div><h2>${title}</h2></div><button class="icon-btn" data-action="close-modal" aria-label="Close">${icon('xmark')}</button></div><div class="modal-content">${content}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`;root.querySelectorAll('[data-action="backdrop-close"]').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)closeModal()}));root.querySelectorAll('[data-pay-method]').forEach(b=>{});bindModalActions();if(window.__paymentOrder)bindPaymentFields()}
function closeModal(){document.getElementById('modal-root').innerHTML='';window.__paymentOrder=null;window.__paymentMethod=null;if(window.__MYPOS_SYNC_PENDING_REFRESH&&state.role){window.__MYPOS_SYNC_PENDING_REFRESH=false;queueMicrotask(()=>{if(!document.querySelector('#modal-root .modal'))render();else window.__MYPOS_SYNC_PENDING_REFRESH=true})}}
function bindModalActions(){document.getElementById('modal-root').onclick=e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;switch(a){case'close-modal':closeModal();break;case'confirm-modifier':confirmModifier(el.dataset.product);break;case'complete-payment':completePayment();break;case'goto-order':{const id=Number(el.dataset.id);closeModal();state.ordersFilter='All';navigate('Orders');setTimeout(()=>viewOrder(id),20);break}case'view-order':viewOrder(Number(el.dataset.id));break;case'preview-receipt':previewReceipt(el.dataset.id?Number(el.dataset.id):null);break;case'google-setup-guide':googleSetupGuide();break;case'add-staff':staffEditor();break;case'save-staff':saveStaff();break;case'edit-staff':staffEditor(Number(el.dataset.id));break;case'reset-staff-pin':resetStaffPin(Number(el.dataset.id));break;case'deactivate-staff':deactivateStaff(Number(el.dataset.id));break;case'save-customer':saveCustomer();break;case'save-stock-adjust':saveStockAdjustment();break;case'save-cash-movement':saveCashMovement();break;case'submit-open-shift':submitOpenShift();break;case'submit-close-shift':submitCloseShift();break;case'print-report':window.print();break;case'cancel-order':cancelOrder(Number(el.dataset.id));break;case'refund-order':refundOrder(Number(el.dataset.id));break;case'apply-order-state':applyOrderState(Number(el.dataset.id),el.dataset.status);break;case'copy-checklist':copyChecklist();break;case'save-integration-notes':saveIntegrationNotes();break;case'close-shift':closeModal();break;}}}
function bindApp(){const root=document.getElementById('root');root.onclick=e=>{const el=e.target.closest('[data-action],[data-nav],[data-product],[data-category],[data-orders-filter],[data-stock],[data-settings-tab]');if(!el)return;if(el.dataset.nav){navigate(el.dataset.nav);return}if(el.dataset.product){addProduct(el.dataset.product);return}if(el.dataset.category){state.activeCategory=el.dataset.category;persist();render();return}if(el.dataset.ordersFilter){state.ordersFilter=el.dataset.ordersFilter;render();return}if(el.dataset.settingsTab){state.activeSettings=el.dataset.settingsTab;render();return}if(el.dataset.stock){adjustStock(el.dataset.id,Number(el.dataset.stock));return}const a=el.dataset.action;if(!a)return;switch(a){case'new-order':if(state.currentOrder.length){showModal('Start a new order?',`<p>This will clear the current unsaved order from this browser.</p>`,`<button class="btn" data-action="close-modal">Keep order</button><button class="btn btn-danger" data-action="confirm-new-order">Discard draft</button>`)}else{state.orderNote='';state.orderType=state.settings.defaultOrderType||'Dine-in';state.table='';state.tableGuestCount=2;render()}break;case'confirm-new-order':state.currentOrder=[];state.orderNote='';state.orderType=state.settings.defaultOrderType||'Dine-in';state.table='';state.tableGuestCount=2;closeModal();render();toast('New order started');break;case'customer-note':customerOrderDialog();break;case'table-open':navigate('Table Management');break;case'begin-dinein-order':if(state.currentOrder.length){toast('Save or clear the current draft before starting another order.',false)}else{state.orderType='Dine-in';state.table='';state.tableGuestCount=2;state.page='Sell';persist();render()}break;case'open-table-settings':state.activeSettings='Table Management';state.page='Settings';persist();render();break;case'start-table-order':startTableOrder(el.dataset.id);break;case'table-status':tableStatusDialog(el.dataset.id);break;case'add-table':addTableDialog();break;case'qty-plus':state.currentOrder[Number(el.dataset.index)].qty++;persist();render();break;case'qty-minus':{const i=Number(el.dataset.index);if(state.currentOrder[i].qty>1)state.currentOrder[i].qty--;else state.currentOrder.splice(i,1);persist();render();break}case'remove-item':state.currentOrder.splice(Number(el.dataset.index),1);persist();render();break;case'save-order':state.orderNote=document.getElementById('order-note')?.value||'';requestOrderCommit('save');break;case'charge':state.orderNote=document.getElementById('order-note')?.value||'';requestOrderCommit('charge');break;case'view-order':viewOrder(Number(el.dataset.id));break;case'barcode':showModal('Scan barcode',`<p class="muted small">A hardware scanner types into the search field. In this demo, enter a product name or SKU below.</p><div class="field"><label>Barcode / SKU</label><input id="barcode-input" placeholder="Enter SKU, e.g. MNS1" autofocus /></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="barcode-search">Find product</button>`);break;case'profile-menu':showModal('Your session',`<div class="role-banner"><span class="avatar">${escapeHtml((state.user?.name||state.role).slice(0,1))}</span><div><strong>${escapeHtml(state.user?.name||state.role)}</strong><small>Role: ${escapeHtml(state.role)}</small></div></div><p class="muted small">Switching the demo role simulates a different staff account. The app does not authenticate real users in this preview.</p><div class="demo-roles">${['Kitchen','Cashier','Manager'].map(r=>`<button class="demo-role" data-action="switch-role" data-role="${r}">${icon(r==='Kitchen'?'utensils':r==='Cashier'?'cash-register':'user-gear')}${r}</button>`).join('')}</div>`,`<button class="btn btn-danger" data-action="logout">${icon('arrow-right-from-bracket')} Lock / sign out</button>`);break;case'logout':closeModal();logout();break;case'switch-role':{const r=el.dataset.role;closeModal();enterRole(r);break}case'shift-quick':navigate('Shift & Cash');break;case'save-settings':saveSettings();break;case'change-own-pin':openOwnPinDialog();break;case'save-sync-settings':saveSyncSettings();break;case'google-signin':showGoogleSetup();break;case'open-shift':openShiftDialog();break;case'close-shift':closeShiftDialog();break;case'cash-movement':cashMovementDialog(el.dataset.type);break;case'open-drawer':openDrawerDialog();break;case'shift-report':showShiftReport();break;case'add-staff':staffEditor();break;case'edit-staff':staffEditor(Number(el.dataset.id));break;case'reset-staff-pin':resetStaffPin(Number(el.dataset.id));break;case'manage-pins':navigate('Team');setTimeout(()=>{showModal('Manage staff PINs',`<p class="muted small">Choose a staff member to reset their personal PIN.</p><div class="staff-list">${state.staff.map(s=>`<div class="staff-row"><span class="avatar">${escapeHtml(s.name.slice(0,1))}</span><div class="staff-info"><strong>${escapeHtml(s.name)}</strong><small>${escapeHtml(s.role)} · ${s.status}</small></div><button class="btn btn-sm" data-action="reset-staff-pin" data-id="${s.id}">Reset PIN</button></div>`).join('')}</div>`,`<button class="btn" data-action="close-modal">Done</button>`)},10);break;case'add-customer':customerEditor();break;case'edit-customer':customerEditor(Number(el.dataset.id));break;case'stock-adjust':stockAdjustmentDialog();break;case'stock-export':downloadCSV('inventory.csv',[['SKU','Product','Category','Stock','Low stock threshold'],...state.products.map(p=>[p.sku,p.name,p.category,p.stock,p.lowStock])]);toast('Inventory CSV downloaded');break;case'report-export':downloadCSV('sales-report.csv',[['Order','Date','Status','Payment','Method','Total','Tax','Net'],...state.orders.map(o=>[o.id,o.createdAt,o.status,o.payment,o.paymentMethod||'',o.total,o.tax||0,o.total-(o.tax||0)])]);toast('Sales report CSV downloaded');break;case'printer-test':toast('Printer test unavailable: no printer connected.',false);break;case'preview-receipt':previewReceipt(el.dataset.id?Number(el.dataset.id):null);break;case'google-setup-guide':googleSetupGuide();break;case'refresh-kitchen':render();toast('Kitchen tickets refreshed');break;case'customer-note':customerOrderDialog();break;}}
root.oninput=e=>{if(e.target.id==='product-search'){state.search=e.target.value;const pos=e.target.selectionStart;render();const input=document.getElementById('product-search');input.focus();input.setSelectionRange(pos,pos)}if(e.target.id==='inventory-search'){state.inventorySearch=e.target.value;const pos=e.target.selectionStart;render();const input=document.getElementById('inventory-search');if(input){input.focus();input.setSelectionRange(pos,pos)}}if(e.target.id==='customer-search'){const query=e.target.value.toLowerCase();document.getElementById('customer-table').innerHTML=customerTableFiltered(query)}};
root.onchange=e=>{if(e.target.id==='order-note'){state.orderNote=e.target.value;persist()}if(e.target.dataset.setting){state.settings[e.target.dataset.setting]=e.target.checked;persist()}if(e.target.id==='cfg-paper-width'){state.settings.receiptWidth=e.target.value;persist()}};root.onkeydown=e=>{if(e.target.id==='product-search'&&e.key==='Enter'){const match=state.products.find(p=>p.sku.toLowerCase()===e.target.value.trim().toLowerCase());if(match){addProduct(match.id);state.search='';render()}else toast('No product found for that SKU.',false)}};}
function customerTableFiltered(q){const list=state.customers.filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(q));if(!list.length)return `<div class="empty-state">No customers match that search.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Orders</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td><strong>${escapeHtml(c.name)}</strong></td><td>${escapeHtml(c.phone||'—')}</td><td>${escapeHtml(c.email||'—')}</td><td>${state.orders.filter(o=>o.customerId===c.id).length}</td><td><button class="btn btn-sm" data-action="edit-customer" data-id="${c.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function adjustStock(id,delta){const p=state.products.find(p=>p.id===id);if(!p)return;let next=p.stock+delta;if(next<0&&!state.settings.allowNegativeStock){toast('Stock cannot go below zero without manager approval.',false);return}p.stock=next;state.stockHistory.unshift({date:new Date().toISOString(),sku:p.sku,name:p.name,change:delta,reason:delta>0?'Manual stock addition':'Manual stock deduction',by:state.user?.name||state.role});persist();publishSyncEvent('inventory.updated',{products:state.products,stockHistory:state.stockHistory.slice(0,100)});render();toast(`${p.name} stock ${delta>0?'increased':'decreased'} by ${Math.abs(delta)}`)}
function stockAdjustmentDialog(){const opts=state.products.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} (${p.sku}) · Current ${p.stock}</option>`).join('');showModal('Stock adjustment',`<div class="field"><label>Product</label><select id="adjust-product">${opts}</select></div><div class="two-fields"><div class="field"><label>Action</label><select id="adjust-action"><option value="add">Add stock (+)</option><option value="subtract">Subtract stock (−)</option><option value="set">Set exact quantity</option></select></div><div class="field"><label>Quantity</label><input id="adjust-qty" type="number" min="0" value="1" /></div></div><div class="field"><label>Reason</label><select id="adjust-reason"><option>Stock count correction</option><option>Supplier delivery</option><option>Damaged / waste</option><option>Return to stock</option><option>Other</option></select></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="save-stock-adjust">Save adjustment</button>`)}
function saveStockAdjustment(){const p=state.products.find(p=>p.id===document.getElementById('adjust-product').value);const type=document.getElementById('adjust-action').value;const qty=Math.max(0,Number(document.getElementById('adjust-qty').value||0));if(!p||qty<0){toast('Enter a valid quantity.',false);return}let next=type==='add'?p.stock+qty:type==='subtract'?p.stock-qty:qty;if(next<0&&!state.settings.allowNegativeStock){toast('Manager approval is required for negative stock.',false);return}const change=next-p.stock;p.stock=next;state.stockHistory.unshift({date:new Date().toISOString(),sku:p.sku,name:p.name,change,reason:document.getElementById('adjust-reason').value,by:state.user?.name||state.role});persist();publishSyncEvent('inventory.updated',{products:state.products,stockHistory:state.stockHistory.slice(0,100)});closeModal();render();toast('Stock adjustment recorded')}
function customerEditor(id){const c=state.customers.find(x=>x.id===id)||{};window.__customerEdit=id||null;showModal(id?'Edit customer':'Add customer',`<div class="field"><label>Full name</label><input id="customer-name" value="${escapeHtml(c.name||'')}" placeholder="Customer name" /></div><div class="two-fields"><div class="field"><label>Phone</label><input id="customer-phone" value="${escapeHtml(c.phone||'')}" placeholder="09xx xxx xxxx" /></div><div class="field"><label>Email</label><input id="customer-email" type="email" value="${escapeHtml(c.email||'')}" placeholder="name@email.com" /></div></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="save-customer">Save customer</button>`)}
function saveCustomer(){const name=document.getElementById('customer-name').value.trim();if(!name){toast('Customer name is required.',false);return}const id=window.__customerEdit;const record={id:id||Date.now(),name,phone:document.getElementById('customer-phone').value.trim(),email:document.getElementById('customer-email').value.trim()};if(id){const i=state.customers.findIndex(c=>c.id===id);state.customers[i]=record}else state.customers.unshift(record);persist();closeModal();render();toast('Customer saved')}
function customerOrderDialog(){showModal('Order type & customer',`<div class="field"><label>Order type</label><select id="order-type"><option ${state.orderType==='Dine-in'?'selected':''}>Dine-in</option><option ${state.orderType==='Takeout'?'selected':''}>Takeout</option><option ${state.orderType==='Delivery'?'selected':''}>Delivery</option></select></div><div class="field"><label>Table / reference</label>${state.settings.tableManagementEnabled!==false?`<select id="order-table"><option value="">Select a table later</option>${state.tables.map(t=>`<option value="${escapeHtml(t.name)}" ${state.table===t.name?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}</select>`:`<input id="order-table" value="${escapeHtml(state.table)}" placeholder="e.g. Table 3" />`}</div><div class="field"><label>Customers at the table</label><input id="order-guests" type="number" min="1" max="100" value="${Math.max(1,Number(state.tableGuestCount||2))}" /></div><div class="field"><label>Customer (optional)</label><select id="order-customer"><option value="">Walk-in / no profile</option>${state.customers.map(c=>`<option value="${c.id}" ${String(state.currentCustomerId||'')===String(c.id)?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="apply-order-type">Apply</button>`) }
function staffEditor(id){if(state.role!=='Manager'){toast('Only managers can manage staff.',false);return}const s=state.staff.find(x=>x.id===id)||{};window.__editingStaffId=id||null;showModal(id?'Edit staff member':'Add staff member',`<div class="field"><label>Staff name</label><input id="staff-name" value="${escapeHtml(s.name||'')}" placeholder="Full name" /></div><div class="two-fields"><div class="field"><label>Role</label><select id="staff-role"><option ${s.role==='Kitchen'?'selected':''}>Kitchen</option><option ${s.role==='Cashier'?'selected':''}>Cashier</option><option ${s.role==='Manager'?'selected':''}>Manager</option></select></div><div class="field"><label>Initial / new PIN</label><input id="staff-pin" inputmode="numeric" maxlength="8" value="${escapeHtml(s.pin||'')}" placeholder="4–8 digits" /></div></div><div class="field"><label>Email (optional for future Google account link)</label><input id="staff-email" type="email" value="${escapeHtml(s.email||'')}" placeholder="staff@yourbusiness.com" /></div><div class="field"><label>Status</label><select id="staff-status"><option ${(!s.status||s.status==='Active')?'selected':''}>Active</option><option ${s.status==='Inactive'?'selected':''}>Inactive</option></select></div><div class="sync-banner"><i class="fa-solid fa-key"></i><div>PINs are local demo values in this preview, not secure production credentials.</div></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="save-staff">Save staff</button>`)}
function saveStaff(){const name=document.getElementById('staff-name').value.trim(),role=document.getElementById('staff-role').value,pin=document.getElementById('staff-pin').value.trim(),email=document.getElementById('staff-email').value.trim(),status=document.getElementById('staff-status').value;if(!name||!pin||!/^[0-9]{4,8}$/.test(pin)){toast('Enter a name and a 4–8 digit PIN.',false);return}if(state.staff.some(s=>s.pin===pin&&s.id!==window.__editingStaffId)){toast('That PIN is already assigned. Choose a unique PIN.',false);return}if(window.__editingStaffId){const s=state.staff.find(s=>s.id===window.__editingStaffId);Object.assign(s,{name,role,pin,email,status})}else state.staff.push({id:Date.now(),name,role,pin,email,status});persist();closeModal();render();toast('Staff access updated')}
function resetStaffPin(id){const s=state.staff.find(s=>s.id===id);if(!s)return;closeModal();showModal('Reset staff PIN',`<p class="muted small">Set a new PIN for <strong>${escapeHtml(s.name)}</strong> (${escapeHtml(s.role)}).</p><div class="field"><label>New PIN (4–8 digits)</label><input id="reset-pin-value" inputmode="numeric" maxlength="8" placeholder="Enter new PIN" /></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="confirm-reset-pin" data-id="${id}">Save new PIN</button>`)}
function deactivateStaff(id){const s=state.staff.find(s=>s.id===id);if(!s)return;s.status=s.status==='Active'?'Inactive':'Active';persist();closeModal();render();toast(`${s.name} ${s.status==='Active'?'reactivated':'deactivated'}`)}
function openShiftDialog(){if(state.shift.open){toast('A shift is already open.',false);return}showModal('Open shift',`<p class="muted small">Record the opening cash float before taking sales.</p><div class="field"><label>Opening cash amount (₱)</label><input type="number" id="opening-cash" min="0" step="0.01" value="2000" /></div><div class="field"><label>Opened by</label><input id="opening-employee" value="${escapeHtml(state.user?.name||state.role)}" /></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="submit-open-shift">${icon('play')} Open shift</button>`)}
function submitOpenShift(){if(state.shift.open){toast('A shift is already open.',false);return}const amount=Number(document.getElementById('opening-cash').value||0);if(amount<0){toast('Opening cash cannot be negative.',false);return}state.shift.id=Number(state.shift.id||0)+1;state.shift.open=true;state.shift.openedAt=new Date().toISOString();state.shift.openingAmount=amount;state.shift.employee=document.getElementById('opening-employee').value.trim()||state.role;state.shift.closedAt=null;state.shift.lastReport=null;persist();closeModal();render();toast('Shift opened')}
function cashMovementDialog(type){if(!state.shift.open){toast('Open a shift before recording cash movements.',false);return}showModal(type,`<div class="field"><label>Amount (₱)</label><input id="movement-amount" type="number" min="0.01" step="0.01" placeholder="0.00" /></div><div class="field"><label>Reason</label><input id="movement-reason" placeholder="e.g. petty cash, starting float correction" /></div><div class="sync-banner"><i class="fa-solid fa-circle-info"></i><div>${type==='Pay In'?'This adds cash to the expected drawer.':'This subtracts cash from the expected drawer.'} It will be recorded in the audit trail.</div></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="save-cash-movement" data-type="${type}">Record ${type}</button>`)}
function saveCashMovement(){if(!state.shift.open){toast('No active shift.',false);return}const amount=Number(document.getElementById('movement-amount').value||0),reason=document.getElementById('movement-reason').value.trim(),type=document.querySelector('.modal-footer [data-action="save-cash-movement"]')?.dataset.type||'Pay In';if(amount<=0||!reason){toast('Enter a positive amount and reason.',false);return}state.transactions.push({id:crypto.randomUUID?.()||String(Date.now()),type,amount,reason,by:state.user?.name||state.role,date:new Date().toISOString(),shiftId:state.shift.id});persist();closeModal();render();toast(`${type} recorded`)}
function openDrawerDialog(){if(!state.settings.manualDrawer){toast('Manual drawer opening is disabled in Settings.',false);return}if(state.role==='Kitchen'){toast('Kitchen staff cannot open the cash drawer.',false);return}const requireReason=state.settings.reasonDrawer;const approval=state.role!=='Manager';showModal('Open cash drawer',`<p class="muted small">This is a hardware action only. Opening the drawer does not add or remove cash from the shift totals.</p>${requireReason?`<div class="field"><label>Reason for opening</label><select id="drawer-reason"><option>Need change</option><option>Cash count</option><option>Customer transaction support</option><option>Other</option></select></div>`:''}${approval?`<div class="field"><label>Manager approval PIN</label><input id="drawer-manager-pin" type="password" inputmode="numeric" placeholder="Manager PIN" /></div>`:''}<div class="sync-banner"><i class="fa-solid fa-lock"></i><div>The prototype cannot trigger physical drawer hardware. Confirming records a demo event only.</div></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="confirm-open-drawer">${icon('cash-register')} Confirm open</button>`)}
function confirmOpenDrawer(){if(state.role!=='Manager'){const pin=document.getElementById('drawer-manager-pin')?.value;const manager=state.staff.find(s=>s.role==='Manager'&&s.status==='Active'&&s.pin===pin);if(!manager){toast('Manager approval PIN is required.',false);return}}const reason=state.settings.reasonDrawer?(document.getElementById('drawer-reason')?.value||'Manual open'):'Manual open';state.transactions.push({id:crypto.randomUUID?.()||String(Date.now()),type:'Drawer Open',amount:0,reason,by:state.user?.name||state.role,date:new Date().toISOString(),shiftId:state.shift.id});persist();closeModal();render();toast('Drawer open event recorded; hardware is not connected')}
function shiftTotals(){const shiftId=state.shift.id;const after=t=>!state.shift.openedAt||new Date(t.date)>=new Date(state.shift.openedAt);const paid=state.orders.filter(o=>o.payment==='Paid'&&(!state.shift.openedAt||new Date(o.paidAt||o.createdAt)>=new Date(state.shift.openedAt)));const cashSales=paid.reduce((sum,o)=>sum+(o.paymentMethod==='Cash'?o.total:o.paymentMethod==='Split'?Number(state.transactions.find(t=>t.type==='Sale'&&t.orderId===o.id)?.cash||0):0),0);const cardSales=paid.filter(o=>o.paymentMethod==='Card').reduce((s,o)=>s+o.total,0);const gcashSales=paid.filter(o=>o.paymentMethod==='GCash').reduce((s,o)=>s+o.total,0);const tx=state.transactions.filter(t=>after(t)&&(!t.shiftId||t.shiftId===shiftId));const payIns=tx.filter(t=>t.type==='Pay In').reduce((s,t)=>s+t.amount,0);const payOuts=tx.filter(t=>t.type==='Pay Out').reduce((s,t)=>s+t.amount,0);const cashRefunds=tx.filter(t=>t.type==='Refund'&&t.method==='Cash').reduce((s,t)=>s+t.amount,0);const opening=Number(state.shift.openingAmount||0);const expected=opening+cashSales+payIns-payOuts-cashRefunds;return {paid,cashSales,cardSales,gcashSales,payIns,payOuts,cashRefunds,opening,expected,totalSales:paid.reduce((s,o)=>s+o.total,0),tax:paid.reduce((s,o)=>s+(o.tax||0),0),tx}}
function closeShiftDialog(){if(!state.shift.open){toast('No active shift to close.',false);return}const x=shiftTotals();showModal('Close shift & reconcile',`<div class="role-banner"><i class="fa-solid fa-calculator"></i><div><strong>Shift #${String(state.shift.id).padStart(3,'0')}</strong><small>Count the physical cash and compare it with the expected drawer.</small></div></div><div class="stat-line"><span>Opening amount</span><strong>${money(x.opening)}</strong></div><div class="stat-line"><span>Cash sales retained</span><strong>${money(x.cashSales)}</strong></div><div class="stat-line"><span>Pay-ins − pay-outs</span><strong>${money(x.payIns-x.payOuts)}</strong></div><div class="stat-line"><span>Cash refunds</span><strong>− ${money(x.cashRefunds)}</strong></div><div class="payment-total"><div><div class="muted small">Expected drawer</div><strong>${money(x.expected)}</strong></div></div><div class="field"><label>Actual cash count (₱)</label><input id="actual-cash-count" type="number" step="0.01" min="0" value="${x.expected.toFixed(2)}" /></div><div class="field"><label>Closing notes (optional)</label><textarea id="close-shift-notes" placeholder="Explain over / short or other notes"></textarea></div><div class="sync-banner"><i class="fa-solid fa-circle-info"></i><div>After closing, the report is saved even if printing fails. Reprints must reference the original shift report.</div></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="submit-close-shift">${icon('lock')} Close shift</button>`)}
function submitCloseShift(){if(!state.shift.open){toast('No active shift.',false);return}const actual=Number(document.getElementById('actual-cash-count').value||0),notes=document.getElementById('close-shift-notes').value.trim(),x=shiftTotals();if(actual<0){toast('Actual cash count cannot be negative.',false);return}const report={id:state.shift.id,openedAt:state.shift.openedAt,closedAt:new Date().toISOString(),employee:state.shift.employee,opening:x.opening,cashSales:x.cashSales,cardSales:x.cardSales,gcashSales:x.gcashSales,payIns:x.payIns,payOuts:x.payOuts,cashRefunds:x.cashRefunds,expected:x.expected,actual,overShort:actual-x.expected,totalSales:x.totalSales,netSales:x.totalSales-x.tax,tax:x.tax,paidOrders:x.paid.length,notes};state.shift.open=false;state.shift.closedAt=report.closedAt;state.shift.lastReport=report;state.shift.openingHistory=[report,...(state.shift.openingHistory||[])];persist();closeModal();render();showShiftReport(report);toast('Shift closed and report saved')}
function showShiftReport(report){const r=report||state.shift.lastReport||{id:state.shift.id,openedAt:state.shift.openedAt,closedAt:state.shift.closedAt,opening:state.shift.openingAmount,cashSales:shiftTotals().cashSales,cardSales:shiftTotals().cardSales,gcashSales:shiftTotals().gcashSales,payIns:shiftTotals().payIns,payOuts:shiftTotals().payOuts,cashRefunds:shiftTotals().cashRefunds,expected:shiftTotals().expected,actual:null,overShort:null,totalSales:shiftTotals().totalSales,netSales:shiftTotals().totalSales-shiftTotals().tax,tax:shiftTotals().tax,paidOrders:shiftTotals().paid.length};const when=(v)=>v?`${formatDate(v)} · ${formatTime(v)}`:'—';showModal('Sales shift report',`<div class="receipt" style="width:100%;max-width:520px;font-family:'DM Sans',sans-serif"><h3>SALES SHIFT REPORT</h3><p>${escapeHtml(state.settings.storeName)}</p><p>Shift #${String(r.id||0).padStart(3,'0')}</p><div class="receipt-line"></div><div class="receipt-row"><span>Shift Open Date & Time</span><strong>${when(r.openedAt)}</strong></div><div class="receipt-row"><span>Shift Close Date & Time</span><strong>${when(r.closedAt)}</strong></div><div class="receipt-line"></div><strong>Cash Summary</strong><div class="receipt-row"><span>Sales / Quantity</span><strong>${r.paidOrders||0}</strong></div><div class="receipt-row"><span>Cash Sales</span><strong>${money(r.cashSales||0)}</strong></div><div class="receipt-row"><span>Net</span><strong>${money((r.cashSales||0))}</strong></div><div class="receipt-line"></div><strong>Card Summary</strong><div class="receipt-row"><span>Sales</span><strong>${money(r.cardSales||0)}</strong></div><div class="receipt-row"><span>Net</span><strong>${money(r.cardSales||0)}</strong></div><div class="receipt-line"></div><strong>GCash Summary</strong><div class="receipt-row"><span>Sales</span><strong>${money(r.gcashSales||0)}</strong></div><div class="receipt-row"><span>Net</span><strong>${money(r.gcashSales||0)}</strong></div><div class="receipt-line"></div><strong>Sales Summary</strong><div class="receipt-row"><span>Total Sales</span><strong>${money(r.totalSales||0)}</strong></div><div class="receipt-row"><span>Total Net</span><strong>${money(r.netSales||0)}</strong></div><div class="receipt-row"><span>VAT included (12%)</span><strong>${money(r.tax||0)}</strong></div><div class="receipt-line"></div><strong>Discount Summary</strong><div class="receipt-row"><span>Discounts</span><strong>${money(0)}</strong></div><div class="receipt-line"></div><strong>Cash Drawer Summary</strong><div class="receipt-row"><span>Opening Amount</span><strong>${money(r.opening||0)}</strong></div><div class="receipt-row"><span>Cash Sales</span><strong>${money(r.cashSales||0)}</strong></div><div class="receipt-row"><span>Pay-ins</span><strong>${money(r.payIns||0)}</strong></div><div class="receipt-row"><span>Pay-outs</span><strong>${money(r.payOuts||0)}</strong></div><div class="receipt-row"><span>Cash Refunds</span><strong>${money(r.cashRefunds||0)}</strong></div><div class="receipt-row"><span>Expected Drawer</span><strong>${money(r.expected||0)}</strong></div><div class="receipt-row"><span>Actual Drawer</span><strong>${r.actual==null?'Not counted':money(r.actual)}</strong></div><div class="receipt-row"><span>Over / Short</span><strong style="color:${(r.overShort||0)<0?'#bb4037':'#168653'}">${r.overShort==null?'—':money(r.overShort)}</strong></div>${r.notes?`<div class="receipt-line"></div><div>Notes: ${escapeHtml(r.notes)}</div>`:''}<div class="receipt-line"></div><p>End of shift report</p></div>`,`<button class="btn" data-action="close-modal">Close</button><button class="btn" data-action="print-report">${icon('printer')} Print report</button><button class="btn btn-primary" data-action="export-shift-report">${icon('download')} Export</button>`,true)}
function openGoogleIntegrationNote(){showGoogleSetup()}
function googleSetupGuide(){closeModal();showModal('Google sign-in & cross-device sync checklist',`<p class="muted small">Use this checklist before enabling real staff access across devices.</p><div class="staff-list">${[['1','Configure Google OAuth','Create a Google Cloud OAuth Web Client and add the app origin. Put Client ID and Secret in Supabase Auth → Providers → Google.'],['2','Use the Supabase callback','Add https://tjjvdsjrdjzqszzdtosk.supabase.co/auth/v1/callback as the Authorized redirect URI.'],['3','Set redirect allow-list','In Supabase Auth URL settings add the deployed MY POS origin and your local development origin.'],['4','Assign staff by Google email','Manager invites each account as Kitchen, Cashier, or Manager. Staff must sign in with that invited email.'],['5','Security rules are server-enforced','Store memberships and role policies validate every mutation. Local PINs/demo role buttons never grant cloud access.'],['6','Action-based sync','Orders, KDS, stock and tables publish only on explicit actions. Event IDs prevent duplicate stock commits.'],['7','Cross-device acceptance test','Save an order on tablet A, verify the KDS on tablet B, process payment and test reconnect/outbox behavior.']].map(x=>`<div class="staff-row"><span class="avatar" style="background:#e6f6ed;color:#11794e">${x[0]}</span><div class="staff-info"><strong>${x[1]}</strong><small>${x[2]}</small></div></div>`).join('')}</div><div class="sync-banner" style="margin-top:15px"><i class="fa-solid fa-shield-halved"></i><div>Google sign-in establishes identity; it does not by itself sync the POS data. A secure database plus role policies and realtime listeners are also required.</div></div>`,`<button class="btn" data-action="close-modal">Close</button><button class="btn btn-primary" data-action="copy-checklist">${icon('copy')} Copy checklist</button>`,true)}
function copyChecklist(){const txt='MY POS cloud sync checklist\n1. Create Firebase project and register web app.\n2. Enable Google Authentication and authorized domains.\n3. Create per-store products, orders, inventory, shifts, settings, and member collections.\n4. Store Kitchen/Cashier/Manager membership and enforce server-side roles.\n5. Apply least-privilege Firestore rules; never trust UI-only roles.\n6. Use idempotent payment/order/stock movement IDs and server timestamps.\n7. Test on two devices including offline/retry recovery.';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Checklist copied')).catch(()=>toast('Could not access clipboard',false));else toast('Clipboard not available in this browser',false)}
function saveSyncSettings(){state.settings.ownerEmail=document.getElementById('cfg-owner-email')?.value.trim()||'';state.settings.storeId=document.getElementById('cfg-store-id')?.value.trim()||'mizzy-bistro-demo';persist();render();toast('Setup details saved locally; cloud sync remains disconnected')}
function saveIntegrationNotes(){saveSyncSettings()}
function saveSettings(){const name=document.getElementById('cfg-store-name');if(name)state.settings.storeName=name.value.trim()||"Mizzy's Bistro";const currency=document.getElementById('cfg-currency');if(currency)state.settings.currency=currency.value;state.settings.taxRate=12;const lock=document.getElementById('cfg-lock');if(lock)state.settings.lockAfter=Number(lock.value);const paper=document.getElementById('cfg-paper-width');if(paper)state.settings.receiptWidth=paper.value;const pn=document.getElementById('cfg-printer-name');if(pn)state.settings.printerName=pn.value;const pi=document.getElementById('cfg-printer-ip');if(pi)state.settings.printerIp=pi.value;const pp=document.getElementById('cfg-printer-port');if(pp)state.settings.printerPort=pp.value;const tableCountEl=document.getElementById('cfg-table-count');const capacityEl=document.getElementById('cfg-table-capacity');const defaultTypeEl=document.getElementById('cfg-default-order-type');if(tableCountEl){const desired=Math.max(1,Math.min(100,Math.floor(Number(tableCountEl.value)||1)));state.settings.tableCount=desired}if(capacityEl)state.settings.defaultTableCapacity=Math.max(1,Math.min(100,Math.floor(Number(capacityEl.value)||4)));if(defaultTypeEl)state.settings.defaultOrderType=defaultTypeEl.value;let desiredCount=Number(state.settings.tableCount||state.tables.length);while(state.tables.length<desiredCount){const id=Math.max(0,...state.tables.map(t=>Number(t.id)||0))+1;state.tables.push({id,name:`Table ${id}`,capacity:Number(state.settings.defaultTableCapacity||4),section:'Main Dining',manualStatus:'Available'})}while(state.tables.length>desiredCount){let idx=-1;for(let i=state.tables.length-1;i>=0;i--){if(!activeOrdersForTable(state.tables[i].name).length){idx=i;break}}if(idx<0)break;state.tables.splice(idx,1)}state.settings.tableCount=state.tables.length;if(!state.currentOrder.length){state.orderType=state.settings.defaultOrderType||'Dine-in';state.table=''}persist();publishSyncEvent('tables.updated',{tables:state.tables,settings:{tableCount:state.settings.tableCount,tableManagementEnabled:state.settings.tableManagementEnabled,defaultTableCapacity:state.settings.defaultTableCapacity,defaultOrderType:state.settings.defaultOrderType,requireGuestCount:state.settings.requireGuestCount,allowMultipleOrdersPerTable:state.settings.allowMultipleOrdersPerTable}});render();toast('Settings saved on this device')}
function viewOrder(id){const o=state.orders.find(o=>Number(o.id)===Number(id));if(!o){toast('Order not found.',false);return}const kitchenOnly=state.role==='Kitchen';const canCharge=state.role==='Manager'||state.role==='Cashier';const content=`<div class="role-banner"><i class="fa-solid fa-receipt"></i><div><strong>Order #${o.id} · ${escapeHtml(o.type||'Takeout')}</strong><small>${formatDate(o.createdAt)} · ${formatTime(o.createdAt)} · ${escapeHtml(o.table||'')}${o.tableGuestCount?` · ${Number(o.tableGuestCount)} guests`:''}</small></div>${kitchenOnly?'':`<span style="margin-left:auto">${statusPill(o.payment)}</span>`}</div><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:10px"><strong style="font-size:12px">Order items</strong><span class="muted small">${o.items.reduce((s,i)=>s+i.qty,0)} items</span></div>${o.items.map(i=>`<div class="stat-line"><span><strong>${i.qty} × ${escapeHtml(i.name)}</strong><small class="muted" style="display:block">${escapeHtml(i.modifiers?.join(', ')||'No modifiers')}</small></span>${kitchenOnly?'':`<strong>${money(i.price*i.qty)}</strong>`}</div>`).join('')}${kitchenOnly?'':`<div class="divider"></div><div class="stat-line"><span>Subtotal (VAT-inclusive)</span><strong>${money(o.subtotal)}</strong></div><div class="stat-line"><span>VAT included (12%)</span><strong>${money(o.tax)}</strong></div><div class="stat-line"><span>Total</span><strong style="font:800 20px Manrope;color:var(--green)">${money(o.total)}</strong></div><div class="setting-row"><div><strong>Payment</strong><small>${o.paymentMethod?escapeHtml(o.paymentMethod):'No payment recorded'}</small></div><span>${statusPill(o.payment)}</span></div>`}<div class="setting-row"><div><strong>Kitchen status</strong><small>Order state is independent from payment.</small></div><span>${statusPill(o.kitchen)}</span></div>${o.note?`<div class="ticket-note" style="margin-top:12px">Kitchen note: ${escapeHtml(o.note)}</div>`:''}`;let footer=`<button class="btn" data-action="close-modal">Close</button>`;if(canCharge&&o.payment!=='Paid')footer+=`<button class="btn btn-primary" data-action="charge-saved-order" data-id="${o.id}">${icon('wallet')} Charge</button>`;if(state.role==='Kitchen'&&o.kitchen!=='Served'&&o.kitchen!=='Completed')footer+=`<button class="btn btn-primary" data-action="kitchen-next" data-id="${o.id}">Next kitchen state</button>`;if(state.role==='Manager'&&o.kitchen==='Served')footer+=`<button class="btn btn-outline-green" data-action="mark-completed" data-id="${o.id}">Mark completed</button>`;if(state.role==='Manager'&&o.payment==='Paid')footer+=`<button class="btn" data-action="refund-order" data-id="${o.id}">Refund</button>`;if(state.role==='Manager'&&o.payment!=='Paid'&&o.kitchen!=='Completed')footer+=`<button class="btn btn-danger" data-action="cancel-order" data-id="${o.id}">Cancel order</button>`;showModal('Order details',content,footer,true)}
function chargeSavedOrder(id){const o=state.orders.find(o=>o.id===Number(id));if(!o)return toast('Order not found.',false);if(o.payment==='Paid')return toast('This order is already paid.',false);closeModal();showPayment({...o,id:o.id,total:o.total,subtotal:o.subtotal,tax:o.tax,items:o.items,type:o.type,table:o.table,note:o.note})}
function setKitchenStatus(id,status){const o=state.orders.find(o=>o.id===Number(id));if(!o)return;if(state.role!=='Kitchen'&&state.role!=='Manager'){toast('You do not have permission to change kitchen status.',false);return}const allowed={New:['Preparing'],Sent:['Preparing'],Preparing:['Ready'],Ready:['Served'],Served:['Completed']};if(!(allowed[o.kitchen]||[]).includes(status)){toast(`Cannot move kitchen status from ${o.kitchen} to ${status}.`,false);return}o.kitchen=status;if(status==='Completed')o.status='Completed';o.updatedAt=new Date().toISOString();persist();publishSyncEvent('kitchen.status',{order:o});render();toast(`Order #${id} moved to ${status}`)}
function cancelOrder(id){const o=state.orders.find(o=>o.id===Number(id));if(!o)return;if(o.payment==='Paid'){toast('Paid orders must be refunded, not cancelled.',false);return}closeModal();showModal('Cancel order',`<p>Cancel order <strong>#${o.id}</strong>? This will be recorded in the audit trail.</p><div class="field"><label>Cancellation reason</label><select id="cancel-reason"><option>Customer cancelled</option><option>Duplicate order</option><option>Wrong order entered</option><option>Out of stock</option><option>Other</option></select></div>`,`<button class="btn" data-action="close-modal">Keep order</button><button class="btn btn-danger" data-action="confirm-cancel-order" data-id="${o.id}">Cancel order</button>`)}
function confirmCancelOrder(id){const o=state.orders.find(o=>o.id===Number(id));if(!o)return;const reason=document.getElementById('cancel-reason')?.value||'Cancelled';if(o.stockDeducted&&!o.stockReversed){for(const item of o.items){const p=state.products.find(p=>p.id===item.id);if(p)p.stock+=item.qty;state.stockHistory.unshift({date:new Date().toISOString(),sku:item.sku,name:item.name,change:item.qty,reason:'Cancelled order reversal',orderId:o.id,by:state.user?.name||state.role})}o.stockReversed=true}o.status='Cancelled';o.kitchen='Cancelled';o.cancelReason=reason;o.cancelledAt=new Date().toISOString();o.cancelledBy=state.user?.name||state.role;persist();publishSyncEvent('order.cancelled',{order:o,products:state.products,stockHistory:state.stockHistory.slice(0,100)});closeModal();render();toast(`Order #${o.id} cancelled; stock movement reversed`)}
function refundOrder(id){const o=state.orders.find(o=>o.id===Number(id));if(!o||o.payment!=='Paid'){toast('Only paid orders can be refunded.',false);return}closeModal();showModal('Refund order',`<div class="role-banner"><i class="fa-solid fa-rotate-left"></i><div><strong>Order #${o.id}</strong><small>Original payment: ${escapeHtml(o.paymentMethod||'Unknown')} · ${money(o.total)}</small></div></div><div class="field"><label>Refund amount (₱)</label><input id="refund-amount" type="number" min="0.01" max="${o.total}" step="0.01" value="${o.total.toFixed(2)}" /></div><div class="field"><label>Refund method</label><select id="refund-method"><option ${o.paymentMethod==='Cash'?'selected':''}>Cash</option><option ${o.paymentMethod==='Card'?'selected':''}>Card</option><option ${o.paymentMethod==='GCash'?'selected':''}>GCash</option></select></div><div class="field"><label>Reason (required)</label><select id="refund-reason"><option>Customer request</option><option>Incorrect item</option><option>Duplicate payment</option><option>Quality issue</option><option>Other</option></select></div><div class="sync-banner"><i class="fa-solid fa-circle-info"></i><div>Refund is recorded as a separate transaction. Stock is not automatically restocked; use a separate stock adjustment if eligible.</div></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="confirm-refund" data-id="${o.id}">Record refund</button>`)}
function confirmRefund(id){const o=state.orders.find(o=>o.id===Number(id));if(!o)return;const amount=Number(document.getElementById('refund-amount').value||0),method=document.getElementById('refund-method').value,reason=document.getElementById('refund-reason').value;if(amount<=0||amount>(o.total-(o.refundedAmount||0))+.001){toast('Refund amount exceeds the refundable balance.',false);return}state.transactions.push({id:crypto.randomUUID?.()||String(Date.now()),type:'Refund',method,amount,reason,by:state.user?.name||state.role,date:new Date().toISOString(),orderId:o.id,shiftId:state.shift.id});o.refundedAmount=(o.refundedAmount||0)+amount;o.refundStatus=o.refundedAmount>=o.total?'Refunded':'Partially refunded';persist();closeModal();render();toast(`${money(amount)} refund recorded; inventory unchanged`)}
function previewReceipt(id){let o=id?state.orders.find(o=>o.id===Number(id)):state.orders[0];if(!o&&state.currentOrder.length){const t=cartTotal();o={id:'Draft',items:state.currentOrder,subtotal:t.subtotal,tax:t.tax,total:t.total,payment:'Unpaid',paymentMethod:'—',createdAt:new Date().toISOString()}}if(!o){toast('No order available for a receipt preview.',false);return}showModal('Receipt preview',`<div class="receipt"><h3>${escapeHtml(state.settings.storeName)}</h3><p>Good Food · Great Moments</p><p>Receipt preview · Not a fiscal receipt</p><div class="receipt-line"></div><div class="receipt-row"><span>Order</span><strong>#${o.id}</strong></div><div class="receipt-row"><span>Date</span><strong>${formatDate(o.paidAt||o.createdAt)} ${formatTime(o.paidAt||o.createdAt)}</strong></div><div class="receipt-line"></div>${o.items.map(i=>`<div class="receipt-row"><span>${i.qty} × ${escapeHtml(i.name)}</span><strong>${money(i.price*i.qty)}</strong></div>${i.modifiers?.length?`<div style="font-size:9px;color:#6b7c70;margin-top:-4px">${escapeHtml(i.modifiers.join(', '))}</div>`:''}`).join('')}<div class="receipt-line"></div><div class="receipt-row"><span>Subtotal (VAT-inclusive)</span><strong>${money(o.subtotal)}</strong></div><div class="receipt-row"><span>VAT included (12%)</span><strong>${money(o.tax)}</strong></div><div class="receipt-row" style="font-size:13px;font-weight:800"><span>TOTAL</span><strong>${money(o.total)}</strong></div><div class="receipt-line"></div><div class="receipt-row"><span>Payment</span><strong>${escapeHtml(o.paymentMethod||'Unpaid')}</strong></div><div class="receipt-line"></div><p>Thank you! Come back soon.</p></div><div class="footer-note">Illustrative preview only. No physical printer is connected.</div>`,`<button class="btn" data-action="close-modal">Close</button><button class="btn btn-primary" data-action="print-report">${icon('print')} Print preview</button>`)}
function downloadCSV(filename,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function applyOrderType(){const nextType=document.getElementById('order-type').value;const typedTable=document.getElementById('order-table')?.value.trim()||'';const guests=Number(document.getElementById('order-guests')?.value||2);state.orderType=nextType;state.table=nextType==='Dine-in'?typedTable:(typedTable||nextType);state.tableGuestCount=Number.isInteger(guests)&&guests>0?guests:2;const customerId=document.getElementById('order-customer')?.value||'';state.currentCustomerId=customerId||null;closeModal();render();toast('Order details updated')}

function handleConfirmReset(id){const pin=document.getElementById('reset-pin-value').value.trim();const s=state.staff.find(s=>s.id===id);if(!s||!/^[0-9]{4,8}$/.test(pin)){toast('Enter a valid 4–8 digit PIN.',false);return}if(state.staff.some(x=>x.pin===pin&&x.id!==id)){toast('That PIN is already assigned.',false);return}s.pin=pin;persist();closeModal();render();toast(`PIN reset for ${s.name}`)}

function saveOwnPin(){const oldPin=document.getElementById('own-old-pin').value.trim(),newPin=document.getElementById('own-new-pin').value.trim(),confirmPin=document.getElementById('own-confirm-pin').value.trim();const staff=state.staff.find(s=>s.id===state.user?.id)||state.staff.find(s=>s.role===state.role&&s.name===state.user?.name);if(!staff||staff.pin!==oldPin){toast('Current PIN is incorrect.',false);return}if(!/^[0-9]{4,8}$/.test(newPin)||newPin!==confirmPin){toast('New PIN must match and contain 4–8 digits.',false);return}if(state.staff.some(s=>s.pin===newPin&&s.id!==staff.id)){toast('That PIN is already assigned.',false);return}staff.pin=newPin;persist();closeModal();toast('Your PIN was changed')}

function bindModalActions(){const root=document.getElementById('modal-root');root.onclick=e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;switch(a){case'close-modal':closeModal();break;case'confirm-new-order':state.currentOrder=[];state.orderNote='';state.orderType=state.settings.defaultOrderType||'Dine-in';state.table='';state.tableGuestCount=2;closeModal();render();toast('New order started');break;case'confirm-modifier':confirmModifier(el.dataset.product);break;case'complete-payment':completePayment();break;case'goto-order':{const id=Number(el.dataset.id);closeModal();state.ordersFilter='All';navigate('Orders');setTimeout(()=>viewOrder(id),20);break}case'view-order':viewOrder(Number(el.dataset.id));break;case'charge-saved-order':chargeSavedOrder(el.dataset.id);break;case'preview-receipt':previewReceipt(el.dataset.id?Number(el.dataset.id):null);break;case'google-setup-guide':googleSetupGuide();break;case'copy-checklist':copyChecklist();break;case'add-staff':staffEditor();break;case'save-staff':saveStaff();break;case'edit-staff':staffEditor(Number(el.dataset.id));break;case'reset-staff-pin':resetStaffPin(Number(el.dataset.id));break;case'confirm-reset-pin':handleConfirmReset(Number(el.dataset.id));break;case'deactivate-staff':deactivateStaff(Number(el.dataset.id));break;case'save-customer':saveCustomer();break;case'save-stock-adjust':saveStockAdjustment();break;case'save-cash-movement':saveCashMovement();break;case'submit-open-shift':submitOpenShift();break;case'submit-close-shift':submitCloseShift();break;case'print-report':window.print();break;case'cancel-order':cancelOrder(Number(el.dataset.id));break;case'confirm-cancel-order':confirmCancelOrder(Number(el.dataset.id));break;case'refund-order':refundOrder(Number(el.dataset.id));break;case'confirm-refund':confirmRefund(Number(el.dataset.id));break;case'confirm-open-drawer':confirmOpenDrawer();break;case'apply-order-type':applyOrderType();break;case'confirm-dinein-commit':confirmDineInCommit(el.dataset.mode||'save');break;case'save-table-status':saveTableStatus(el.dataset.id);break;case'save-new-table':saveNewTable();break;case'barcode-search':{const q=document.getElementById('barcode-input').value.trim().toLowerCase();const p=state.products.find(p=>p.sku.toLowerCase()===q||p.name.toLowerCase().includes(q));closeModal();if(p){addProduct(p.id)}else toast('No product found.',false);break}case'kitchen-status':setKitchenStatus(Number(el.dataset.id),el.dataset.status);break;case'kitchen-next':{const o=state.orders.find(o=>o.id===Number(el.dataset.id));if(o)setKitchenStatus(o.id,({'New':'Preparing','Preparing':'Ready','Ready':'Served','Served':'Completed'})[o.kitchen]||'Preparing');break}case'mark-completed':{const o=state.orders.find(o=>o.id===Number(el.dataset.id));if(o&&state.role==='Manager'){o.kitchen='Completed';o.status='Completed';persist();closeModal();render();toast('Order completed')}break}case'change-own-pin':closeModal();showModal('Change my PIN',`<div class="field"><label>Current PIN</label><input id="own-old-pin" type="password" inputmode="numeric" maxlength="8" /></div><div class="field"><label>New PIN</label><input id="own-new-pin" type="password" inputmode="numeric" maxlength="8" /></div><div class="field"><label>Confirm new PIN</label><input id="own-confirm-pin" type="password" inputmode="numeric" maxlength="8" /></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="save-own-pin">Save PIN</button>`);break;case'save-own-pin':saveOwnPin();break;case'export-shift-report':exportShiftReport();break;case'save-integration-notes':saveIntegrationNotes();break;case'confirm-open-drawer':confirmOpenDrawer();break;case'switch-role':closeModal();switchRole(el.dataset.role);break;}}}

confirmModifier=function(id){

}

function editProductDialog(id){
 const p=id!=null?state.products.find(x=>String(x.id)===String(id)):null;window.__editingProductId=p?p.id:null;
 const cats=[...new Set(state.products.map(x=>x.category).filter(Boolean))];const currentOptions=p?(Array.isArray(p.modifierOptions)&&p.modifierOptions.length?p.modifierOptions:(p.modifiers||[]).map(name=>({name,price:0}))):[];
 const content=`<div class="two-fields"><div class="field"><label>Product name</label><input id="editor-product-name" value="${escapeHtml(p?.name||'')}" placeholder="Product name" /></div><div class="field"><label>Base price (₱)</label><input id="editor-product-price" type="number" min="0" step="0.01" value="${Number(p?.price||0)}" /></div></div><div class="two-fields"><div class="field"><label>Category</label><input id="editor-product-category" list="product-categories" value="${escapeHtml(p?.category||'Mains')}" placeholder="Category" /><datalist id="product-categories">${cats.map(c=>`<option value="${escapeHtml(c)}"></option>`).join('')}</datalist></div><div class="field"><label>Starting stock</label><input id="editor-product-stock" type="number" min="0" step="1" value="${Number(p?.stock??10)}" ${p?'disabled':''} /><small class="field-help">New products start with 10 units. Edit stock in Inventory.</small></div></div><div class="setting-row"><div><strong>Show photo on product tile</strong><small>The global photo setting can hide all tile photos at once.</small></div><label class="toggle"><input id="editor-product-show-photo" type="checkbox" ${p?.showPhoto!==false?'checked':''}><span></span></label></div><div class="divider"></div><h3 style="margin:0 0 5px;font:800 14px Manrope">Modifier options</h3><p class="field-help">Each selected option changes the unit price by its extra amount.</p><div id="product-modifier-rows">${currentOptions.map(o=>productModifierRow(o)).join('')}</div><button type="button" class="btn btn-outline-green" data-action="add-product-modifier">${icon('plus')} Add modifier</button>`;
 showModal(p?'Edit product':'Add product',content,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="save-product">${icon('floppy-disk')} Save product</button>`,true)
}
function saveProductEditor(){
 const name=document.getElementById('editor-product-name')?.value.trim()||'';const price=Number(document.getElementById('editor-product-price')?.value);const category=document.getElementById('editor-product-category')?.value.trim()||'';const stock=Number(document.getElementById('editor-product-stock')?.value||10);const showPhoto=!!document.getElementById('editor-product-show-photo')?.checked;
 if(!name||!category||!Number.isFinite(price)||price<0){toast('Enter a product name, category, and valid price.',false);return}
 const options=[...document.querySelectorAll('.product-mod-row')].map(r=>({name:r.querySelector('[data-mod-name]')?.value.trim()||'',price:Number(r.querySelector('[data-mod-price]')?.value||0)}));
 if(options.some(o=>!o.name||!Number.isFinite(o.price)||o.price<0)){toast('Each modifier needs a name and a valid non-negative price.',false);return}
 if(options.some((o,i)=>options.findIndex(x=>x.name.toLowerCase()===o.name.toLowerCase())!==i)){toast('Modifier names must be unique for this product.',false);return}
 let p=window.__editingProductId!=null?state.products.find(x=>String(x.id)===String(window.__editingProductId)):null;
 if(!p){const id=`custom-${Date.now()}`;p={id,sku:`NEW${String(Date.now()).slice(-6)}`,name,category,price,stock:Math.max(0,Math.floor(stock||10)),lowStock:3,trackStock:true,modifiers:[],modifierOptions:[],imageIndex:state.products.length%FOOD_IMAGES.length,showPhoto};state.products.unshift(p)}
 Object.assign(p,{name,price,category,showPhoto,modifierOptions:options,modifiers:options.map(o=>o.name)});
 persist();publishSyncEvent('products.updated',{products:state.products});closeModal();state.page='Settings';state.activeSettings='Products & Modifiers';render();toast('Product and modifier settings saved')
}

saveCurrentOrder=function(){const order=commitCurrentOrder();if(!order)return;render();const label=orderDisplayIdentifier(order);showModal('Order saved',`<div style="text-align:center;padding:14px 0 18px"><div style="width:58px;height:58px;background:#e7f7ed;color:#168553;border-radius:18px;display:grid;place-items:center;font-size:24px;margin:0 auto 13px">${icon('check')}</div><h2 style="font:800 20px Manrope;margin:0 0 7px">${escapeHtml(label)} saved</h2><p class="muted" style="margin:0 0 16px">Kitchen ticket queued and stock updated.</p><div class="stat-line"><span>Kitchen</span><strong>${state.settings.autoKitchen?'Sent':'Routing paused'}</strong></div><div class="stat-line"><span>Inventory</span><strong>Updated</strong></div></div>`,`<button class="btn" data-action="close-modal">Back to Sell</button><button class="btn btn-primary" data-action="goto-order" data-id="${order.id}">View order</button>`);toast('Order saved')}

kitchenPage=function(){const all=state.orders.filter(o=>!['Completed','Cancelled'].includes(o.kitchen));const groups=[['New',all.filter(o=>['New','Sent'].includes(o.kitchen))],['Preparing',all.filter(o=>o.kitchen==='Preparing')],['Ready',all.filter(o=>o.kitchen==='Ready')],['Served',all.filter(o=>o.kitchen==='Served')]];return `${head('Kitchen display','Prepare saved tickets and move each through its kitchen status.',`<span class="pill pill-green">${all.length} active tickets</span><span class="pill pill-gray">Action-based updates</span>`)}<div class="kds-board">${groups.map(([label,items])=>`<section class="kds-col"><div class="kds-col-head"><span>${label==='New'?'New tickets':label}</span><span class="kds-count">${items.length}</span></div>${items.length?items.map(o=>`<article class="kds-ticket"><div class="ticket-head"><span style="font-weight:800">${escapeHtml(orderDisplayIdentifier(o))}<small class="ticket-time" style="display:block">${o.type==='Dine-in'&&o.tableGuestCount?`${Number(o.tableGuestCount)} guests · `:''}${formatTime(o.createdAt)}</small></span>${statusPill(o.payment)}</div><div class="ticket-items">${o.items.map(it=>`<div class="ticket-item"><span>${it.qty}×</span><span>${escapeHtml(it.name)}${it.modifiers?.length?`<small class="muted" style="display:block;margin-top:2px">${escapeHtml(it.modifiers.join(', '))}</small>`:''}</span></div>`).join('')}</div>${o.note?`<div class="ticket-note">${icon('note-sticky')} ${escapeHtml(o.note)}</div>`:''}<div class="ticket-actions">${label==='New'?`<button class="btn btn-primary btn-sm" data-action="kitchen-status" data-id="${o.id}" data-status="Preparing">${icon('play')} Start</button>`:label==='Preparing'?`<button class="btn btn-primary btn-sm" data-action="kitchen-status" data-id="${o.id}" data-status="Ready">${icon('check')} Ready</button>`:label==='Ready'?`<button class="btn btn-primary btn-sm" data-action="kitchen-status" data-id="${o.id}" data-status="Served">${icon('bell-concierge')} Served</button>`:`<button class="btn btn-sm" data-action="view-order" data-id="${o.id}">View ticket</button>`}</div></article>`).join(''):`<div style="padding:22px 7px;text-align:center;color:#94a198;font-size:11px">No tickets here</div>`}</section>`).join('')}</div>`}

class="btn" data-action="close-modal">Close</button>`;if(canCharge&&o.payment!=='Paid')footer+=`<button class="btn btn-primary" data-action="charge-saved-order" data-id="${o.id}">${icon('wallet')} Charge</button>`;if(state.role==='Kitchen'&&o.kitchen!=='Served'&&o.kitchen!=='Completed')footer+=`<button class="btn btn-primary" data-action="kitchen-next" data-id="${o.id}">Next</button>`;if(state.role==='Manager'&&o.kitchen==='Served')footer+=`<button class="btn btn-outline-green" data-action="mark-completed" data-id="${o.id}">Complete</button>`;if(state.role==='Manager'&&o.payment==='Paid')footer+=`<button class="btn" data-action="refund-order" data-id="${o.id}">Refund</button>`;if(state.role==='Manager'&&o.payment!=='Paid'&&o.kitchen!=='Completed')footer+=`<button class="btn btn-danger" data-action="cancel-order" data-id="${o.id}">Cancel</button>`;showModal('Ticket details',content,footer,true)}

staffEditor=function(id){if(state.role!=='Manager'){toast('Only managers can manage staff assignments.',false);return}const s=state.staff.find(x=>x.id===id)||{};window.__editingStaffId=id||null;showModal(id?'Edit staff assignment':'Add staff assignment',`<div class="field"><label>Assigned role</label><select id="staff-role"><option ${s.role==='Kitchen'?'selected':''}>Kitchen</option><option ${s.role==='Cashier'?'selected':''}>Cashier</option><option ${s.role==='Manager'?'selected':''}>Manager</option></select></div><div class="field"><label>${id?'Set / reset PIN':'Initial PIN'} (4–8 digits)</label><input id="staff-pin" inputmode="numeric" maxlength="8" value="${escapeHtml(s.pin||'')}" placeholder="Enter PIN" /></div><div class="field"><label>Assignment status</label><select id="staff-status"><option ${(!s.status||s.status==='Active')?'selected':''}>Active</option><option ${s.status==='Inactive'?'selected':''}>Inactive</option></select></div><div class="sync-banner"><i class="fa-solid fa-key"></i><div>This assignment grants access by role. PINs in this prototype are local demo values, not production credentials.</div></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="save-staff">Save assignment</button>`)}
saveStaff=function(){const role=document.getElementById('staff-role').value,pin=document.getElementById('staff-pin').value.trim(),status=document.getElementById('staff-status').value;if(!pin||!/^[0-9]{4,8}$/.test(pin)){toast('Enter a 4–8 digit PIN.',false);return}if(state.staff.some(s=>s.pin===pin&&s.id!==window.__editingStaffId)){toast('That PIN is already assigned.',false);return}let s;if(window.__editingStaffId){s=state.staff.find(s=>s.id===window.__editingStaffId);if(!s)return;Object.assign(s,{role,pin,status})}else{s={id:Date.now(),role,pin,status,email:''};state.staff.push(s)}const n=state.staff.filter(x=>x.role===role).findIndex(x=>x.id===s.id)+1;s.name=`${role} Assignment ${n}`;s.email='';persist();closeModal();render();toast('Staff assignment saved')}

const baseToastNoNames=toast;

const bindAppBeforeRefinement=bindApp;
bindApp=function(){
 bindAppBeforeRefinement();const root=document.getElementById('root');const oldClick=root.onclick;
 root.onclick=function(e){const el=e.target.closest('[data-action]');const action=el?.dataset.action;
  if(action==='profile-menu'){showModal('Staff assignment',`<div class="role-banner"><span class="avatar">${icon(state.role==='Kitchen'?'utensils':state.role==='Cashier'?'cash-register':'user-gear')}</span><div><strong>${escapeHtml(state.role)} assignment</strong><small>Switch role to preview each staff screen.</small></div></div><div class="demo-roles">${['Kitchen','Cashier','Manager'].map(r=>`<button class="demo-role" data-action="switch-role" data-role="${r}">${icon(r==='Kitchen'?'utensils':r==='Cashier'?'cash-register':'user-gear')}${r}</button>`).join('')}</div>`,`<button class="btn btn-danger" data-action="logout">${icon('arrow-right-from-bracket')} Lock / sign out</button>`);return}
  if(el?.dataset.product&&window.__skipProductClickUntil&&Date.now()<window.__skipProductClickUntil&&window.__skipProductClickId===el.dataset.product){window.__skipProductClickUntil=0;return}
  if(action==='add-product'){if(state.role!=='Manager'){toast('Only managers can edit products.',false);return}editProductDialog(null);return}
  if(action==='edit-product'){if(state.role!=='Manager'){toast('Only managers can edit products.',false);return}editProductDialog(el.dataset.id);return}
  if(action==='product-details'){productDetailsDialog(el.dataset.id);return}
  if(action==='add-product-modifier'){const wrap=document.getElementById('product-modifier-rows');if(wrap){wrap.insertAdjacentHTML('beforeend',productModifierRow({}));wrap.lastElementChild?.querySelector('[data-mod-name]')?.focus()}return}
  if(action==='save-product'){saveProductEditor();return}
  if(action==='remove-product-modifier'){el.closest('.product-mod-row')?.remove();return}
  if(oldClick)oldClick.call(this,e);
 };
 const oldInput=root.oninput;root.oninput=function(e){if(oldInput)oldInput.call(this,e);if(e.target.id==='product-settings-search'){const q=e.target.value.toLowerCase().trim();root.querySelectorAll('[data-product-row]').forEach(row=>row.style.display=(!q||row.dataset.search.includes(q))?'':'none')}};
 const oldChange=root.onchange;root.onchange=function(e){if(oldChange)oldChange.call(this,e);if(e.target.dataset.setting==='showProductPhotos'||e.target.dataset.setting==='animateUI'){render()} };
 root.onpointerdown=e=>{if(state.settings.longPress===false)return;const el=e.target.closest('.product[data-product-id]');if(!el)return;const id=el.dataset.productId;clearTimeout(window.__myposLongPressTimer);window.__myposLongPressTimer=setTimeout(()=>{window.__skipProductClickId=id;window.__skipProductClickUntil=Date.now()+1200;productDetailsDialog(id)},520)};
 root.onpointerup=root.onpointercancel=root.onpointerleave=()=>clearTimeout(window.__myposLongPressTimer);
 root.ontouchstart=e=>{if(state.settings.swipeRemove===false)return;const item=e.target.closest('.cart-item[data-cart-index]');if(!item||!e.touches?.length)return;window.__myposSwipe={index:Number(item.dataset.cartIndex),x:e.touches[0].clientX,y:e.touches[0].clientY}};

}

saveOwnPin=function(){const oldPin=document.getElementById('own-old-pin')?.value.trim(),newPin=document.getElementById('own-new-pin')?.value.trim(),confirmPin=document.getElementById('own-confirm-pin')?.value.trim();const staff=state.staff.find(s=>s.id===state.user?.id)||state.staff.find(s=>s.role===state.role&&s.status==='Active');if(!staff||staff.pin!==oldPin){toast('Current PIN is incorrect.',false);return}if(!/^[0-9]{4,8}$/.test(newPin)||newPin!==confirmPin){toast('New PIN must match and contain 4–8 digits.',false);return}if(state.staff.some(s=>s.pin===newPin&&s.id!==staff.id)){toast('That PIN is already assigned.',false);return}staff.pin=newPin;persist();closeModal();toast('Assignment PIN changed')}
