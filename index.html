/* MY POS polish: compact touch-first controls, gentle motion, reduced-motion support. */
@keyframes mypos-enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes mypos-modal-in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}

.app .main{animation:mypos-enter .2s ease-out both}
.card,.product,.table-card,.kds-ticket,.settings-section,.nav-btn,.btn,.cat-chip{transition:background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease}

.product-management-row:last-child{border-bottom:0}
.product-management-row:hover{background:#f8fcf9}
.product-management-row .pm-info{flex:1;min-width:0}
.product-management-row .pm-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.product-management-row .pm-meta{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.product-management-row .pm-price{font:800 13px Manrope;color:var(--green);white-space:nowrap}
.product-mod-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 36px;gap:8px;align-items:center;margin-bottom:8px}
.product-mod-row input{width:100%;min-width:0;border:1px solid #dfe8e2;border-radius:9px;padding:10px;background:white;color:var(--ink)}
.product-mod-row .remove-mod{border:1px solid #f0cccc;border-radius:9px;background:#fff7f7;color:#b54242;height:38px}
.field-help{font-size:11px;color:var(--muted);margin:-4px 0 9px}
.btn small{display:none!important}
.cart-actions .btn{flex-direction:row;gap:8px;min-height:48px;font-size:13px}
.cart-actions .btn span{font-size:13px}
.profile-pill .profile-name{font-size:12px}
.modal-backdrop{animation:mypos-enter .16s ease-out both}
.modal{animation:mypos-modal-in .18s ease-out both}
.toast{animation:mypos-toast-in .18s ease-out both}
.swipe-hint{font-size:10px;color:var(--muted);padding:0 16px 8px}
.app.motion-off *, .app.motion-off *::before, .app.motion-off *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

function applyDefaultHotColdModifiers(items){
 const hotColdNames=new Set(['Chamomile Tea','Hibiscus Hot Tea','Matcha','Choco']);
 return (Array.isArray(items)?items:[]).map(p=>{
  if(p.category!=='Coffee'&&!hotColdNames.has(p.name))return p;
  const options=Array.isArray(p.modifierOptions)&&p.modifierOptions.length?p.modifierOptions.map(o=>({...o})):(p.modifiers||[]).map(name=>({name,price:0}));
  for(const name of ['Hot','Cold'])if(!options.some(o=>String(o.name||'').toLowerCase()===name.toLowerCase()))options.push({name,price:20});
  return {...p,modifierOptions:options};
 });
}

const SYNC_EVENT_KEY=`${KEY}-sync-event`;

  const adapter=window.MYPOS_SYNC_ADAPTER;
  if(adapter&&typeof adapter.publish==='function')Promise.resolve(adapter.publish(event,window.MYPOS_CREATE_CLOUD_SNAPSHOT?.())).catch(err=>{console.error('MY POS cloud sync publish failed',err);if(window.MYPOS_CLOUD?.active){const queued=window.MYPOS_CLOUD.status?.().queuedActions||0;toast(queued?`Cloud sync pending: ${err.message||'check connection'}`:`Cloud rejected this action: ${err.message||'review the order'}`,false)}});

function mergeRemoteOrder(order){if(!order||order.id==null)return;const stable=order.clientOrderId||order.cloudId;const i=state.orders.findIndex(x=>stable&&(String(x.clientOrderId||x.cloudId)===String(stable))||(!stable&&String(x.id)===String(order.id)));if(i<0)state.orders.unshift(order);else state.orders[i]={...state.orders[i],...order}}
function handleIncomingSyncEvent(event){
  if(!event||!event.id||event.origin===SYNC_CLIENT_ID||!rememberSyncEvent(event.id))return;
  if(event.storeId&&event.storeId!==currentStoreId())return;
  const payload=event.payload||{};
  if(['order.saved','order.paid','order.cancelled'].includes(event.type)){
    mergeRemoteOrder(payload.order);
    if(Array.isArray(payload.products))state.products=payload.products;
    if(Array.isArray(payload.stockHistory))state.stockHistory=payload.stockHistory;
    if(Array.isArray(payload.transactions)){
      const have=new Set(state.transactions.map(t=>String(t.id)));
      payload.transactions.forEach(t=>{if(!have.has(String(t.id)))state.transactions.push(t)});
    }
  }else if(event.type==='kitchen.status'){
    mergeRemoteOrder(payload.order);
  }else if(event.type==='inventory.updated'){
    if(Array.isArray(payload.products))state.products=payload.products;
    if(Array.isArray(payload.stockHistory))state.stockHistory=payload.stockHistory;
  }else if(event.type==='products.updated'){
    if(Array.isArray(payload.products))state.products=payload.products;
  }else if(event.type==='tables.updated'){
    if(Array.isArray(payload.tables))state.tables=payload.tables;
    if(payload.settings)state.settings={...state.settings,...payload.settings};

}

function connectSyncAdapter(adapter){

function header(){return `<header class="topbar"><div class="brand"><div class="brandmark">${icon('store')}</div><div><strong>MY POS</strong><small>Simple. Fast. Reliable.</small></div></div><div class="topline"></div><div class="top-label">Modern · Simple · Reliable</div><div class="header-spacer"></div><div class="cloud-status" title="Only user actions emit sync events. Cross-device cloud sync needs an authenticated backend.">${icon('circle')} Action-based sync · cloud not connected</div><button class="profile-pill" data-action="profile-menu"><span class="avatar">${escapeHtml((state.user?.name||state.role||'U').slice(0,1).toUpperCase())}</span><span class="profile-name">${escapeHtml(state.user?.name||state.role)} <small style="display:block;color:#d5eee0;font-size:10px">${escapeHtml(state.role)}</small></span>${icon('chevron-down')}</button></header>`}
function sidebar(){let groups=['POS','WORK','MANAGE','ADMIN'];let html='<aside class="sidebar">';for(const group of groups){const items=navItems.filter(n=>n[2]===group&&isAllowed(n[0])&&(n[0]!=='Table Management'||state.settings.tableManagementEnabled!==false));if(!items.length)continue;html+=`<div><div class="nav-label">${group==='POS'?'Point of sale':group==='WORK'?'Kitchen operations':group==='MANAGE'?'Business tools':'Administration'}</div><div class="nav-group">`;for(const n of items){const count=n[0]==='Orders'?state.orders.filter(o=>o.payment!=='Paid').length:n[0]==='Kitchen'?state.orders.filter(o=>!['Served','Completed','Cancelled'].includes(o.kitchen)).length:0;html+=`<button class="nav-btn ${state.page===n[0]?'active':''}" data-nav="${n[0]}">${icon(n[1])}<span>${n[0]}</span>${count?`<span class="nav-count">${count}</span>`:''}</button>`}html+='</div></div>'}html+=`<div class="side-bottom"><div class="shift-mini"><div class="tiny"><span class="live-dot"></span>${state.shift.open?'Shift open':'Shift closed'}</div><strong>${state.shift.open?'#'+String(state.shift.id).padStart(3,'0'):'No active shift'}</strong><div class="tiny">${state.shift.open?'Started '+formatTime(state.shift.openedAt):'Open a shift before trading'}</div>${state.role==='Manager'||state.role==='Cashier'?`<button class="btn btn-sm btn-wide ${state.shift.open?'btn-quiet':'btn-primary'}" style="margin-top:10px" data-action="shift-quick">${state.shift.open?'View shift':'Open shift'}</button>`:''}</div><button class="nav-btn" style="margin-top:9px" data-action="logout">${icon('arrow-right-from-bracket')}<span>Lock / Sign out</span></button></div></aside>`;return html}
function mobileNav(){const mobileItems=state.role==='Kitchen'?['Kitchen','Orders','Settings']:state.role==='Cashier'?['Sell','Orders','Table Management','Customers','Shift & Cash']:['Sell','Orders','Table Management','Inventory','Reports','Settings'];return `<nav class="mobile-bottom">${mobileItems.filter(p=>p!=='Table Management'||state.settings.tableManagementEnabled!==false).map(p=>`<button class="${state.page===p?'active':''}" data-nav="${p}">${icon(navItems.find(n=>n[0]===p)?.[1]||'circle')}<span>${p==='Shift & Cash'?'Shift':p==='Table Management'?'Tables':p}</span></button>`).join('')}</nav>`}
function head(title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">MY POS · ${escapeHtml(state.role)}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function pageContent(){switch(state.page){case'Sell':return sellPage();case'Orders':return ordersPage();case'Kitchen':return kitchenPage();case'Table Management':return tableManagementPage();case'Inventory':return inventoryPage();case'Customers':return customersPage();case'Reports':return reportsPage();case'Shift & Cash':return shiftPage();case'Team':return teamPage();case'Settings':return settingsPage();default:return sellPage()}}
function sellPage(){const categories=['All items',...new Set(state.products.map(p=>p.category))];const products=state.products.filter(p=>(state.activeCategory==='All items'||p.category===state.activeCategory)&&(!state.search||(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(state.search.toLowerCase())));const total=cartTotal();return `${head('Sell','Choose products, customize items, then save to kitchen or charge the customer.',`<button class="btn" data-action="new-order">${icon('rotate-left')} New order</button><button class="btn btn-primary" data-action="customer-note">${icon('user-plus')} Customer / table</button>`)}<div class="sell-layout"><section><div class="catalog-toolbar"><label class="searchbox">${icon('magnifying-glass')}<input id="product-search" placeholder="Search products or scan barcode…" value="${escapeHtml(state.search)}" /></label><button class="icon-btn" title="Barcode scan" data-action="barcode">${icon('barcode')}</button></div><div class="categories">${categories.map(c=>`<button class="cat-chip ${c===state.activeCategory?'active':''}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}</div><div class="product-grid">${products.map(p=>productCard(p)).join('')||`<div class="empty-state">${icon('magnifying-glass')}<div>No products match</div></div>`}</div><div class="footer-note">${state.products.length} active products · Tap a product to add · Long-press for quick details</div></section><aside class="card cart-panel"><div class="cart-top"><div><h2>Current Order</h2><div class="cart-meta">${state.currentOrder.length?`${cartQuantity()} items · ${state.orderType}${state.orderType==='Dine-in'&&state.table?` · ${escapeHtml(state.table)}${state.tableGuestCount?` · ${state.tableGuestCount} guests`:''}`:state.orderType==='Dine-in'?' · table details requested on save':''}`:'No items added yet'}</div></div><span class="pill ${state.currentOrder.length?'pill-amber':'pill-gray'}">${state.currentOrder.length?'Draft · Unpaid':'Empty'}</span></div><div class="cart-items">${state.currentOrder.length?state.currentOrder.map((item,i)=>cartItem(item,i)).join(''):`<div class="empty-orders"><div style="width:72px;height:72px;border-radius:20px;background:#f1f8f4;color:#78a88d;display:grid;place-items:center;font-size:25px;margin:12px auto">${icon('basket-shopping')}</div><strong style="color:#40564a">Your order starts here</strong><div class="small" style="margin-top:5px">Tap any product to add it to the current order.</div></div>`}</div><textarea class="cart-note" id="order-note" rows="2" placeholder="Order notes for kitchen (optional)…">${escapeHtml(state.orderNote)}</textarea><div class="cart-summary"><div class="summary-row"><span>Subtotal (VAT-inclusive)</span><strong>${money(total.subtotal)}</strong></div><div class="summary-row"><span>VAT included (12%)</span><strong>${money(total.tax)}</strong></div><div class="summary-row total"><span>Total</span><strong>${money(total.total)}</strong></div><div class="cart-actions"><button class="btn btn-outline-green" data-action="save-order" ${!state.currentOrder.length?'disabled':''}>${icon('floppy-disk')}<span>Save Order</span><small>Send to kitchen & update stock</small></button><button class="btn btn-primary" data-action="charge" ${!state.currentOrder.length?'disabled':''}>${icon('wallet')}<span>Charge</span><small>Proceed to payment</small></button></div></div></aside></div>`}
function productCard(p){return `<button class="product" data-product="${p.id}"><div class="product-img"><img src="${FOOD_IMAGES[p.imageIndex%FOOD_IMAGES.length]}" alt="" loading="lazy"/><span class="product-stock">${p.stock<=p.lowStock?`Low stock · ${p.stock}`:'Stock '+p.stock}</span></div><div class="product-copy"><span class="product-name">${escapeHtml(p.name)}</span><span class="product-sku">${escapeHtml(p.sku)} · ${escapeHtml(p.category)}</span><div class="product-bottom"><span class="product-price">${money(p.price)}</span><span class="add-dot">${icon('plus')}</span></div></div></button>`}
function cartItem(item,i){const p=state.products.find(x=>x.id===item.id)||item;return `<div class="cart-item"><div class="cart-item-main"><div class="cart-item-name"><span>${escapeHtml(item.name)}</span><span>${money(item.price*item.qty)}</span></div><div class="cart-mod">${escapeHtml(item.modifiers?.join(' · ')||'No modifiers')}</div><div class="qty-control"><button data-action="qty-minus" data-index="${i}" aria-label="Decrease">${icon('minus')}</button><strong>${item.qty}</strong><button data-action="qty-plus" data-index="${i}" aria-label="Increase">${icon('plus')}</button><button class="cart-remove" data-action="remove-item" data-index="${i}" aria-label="Remove">${icon('trash-can')}</button></div></div></div>`}
function cartTotal(){const subtotal=state.currentOrder.reduce((s,x)=>s+x.price*x.qty,0);const rate=Math.max(0,Number(state.settings.taxRate??12));const tax=rate>0?subtotal*rate/(100+rate):0;return {subtotal,tax,total:subtotal}}
function cartQuantity(){return state.currentOrder.reduce((s,x)=>s+x.qty,0)}
function addProduct(id){const p=state.products.find(x=>x.id===id);if(!p)return;const existing=state.currentOrder.find(x=>x.id===p.id&&!x.modifiers?.length);const demand=(existing?.qty||0)+1;if(p.stock<demand&&!(state.role==='Manager'&&state.settings.allowNegativeStock)){toast(`Insufficient stock for ${p.name}. Manager approval is required.`,false);return}if(p.stock<demand)toast(`Manager override: ${p.name} will go below zero stock.`,false);if(p.modifiers?.length){openModifier(p);return}if(existing)existing.qty++;else state.currentOrder.push({id:p.id,sku:p.sku,name:p.name,price:p.price,qty:1,modifiers:[]});persist();render()}
function openModifier(p){const options=p.modifiers.map((m,i)=>`<label style="display:flex;justify-content:space-between;align-items:center;border:1px solid #e4ece7;border-radius:9px;padding:10px;margin-bottom:7px;gap:10px"><span><strong style="font-size:12px">${escapeHtml(m)}</strong><small style="display:block;color:#86948b;font-size:10px;margin-top:3px">Option ${i+1}</small></span><input type="checkbox" name="modifier-option" value="${escapeHtml(m)}" ${i===0?'':''} /></label>`).join('');showModal('Product options',`<p class="muted small" style="margin-top:-4px">${escapeHtml(p.name)} · ${money(p.price)}</p><div class="field"><label>Choose modifiers</label>${options}</div><div class="field"><label>Special instructions</label><textarea id="modifier-note" placeholder="e.g. no onions, sauce on the side"></textarea></div><div class="field"><label>Quantity</label><input type="number" id="modifier-qty" min="1" max="99" value="1" /></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="confirm-modifier" data-product="${p.id}">Add to order · ${money(p.price)}</button>`)}
function confirmModifier(id){const p=state.products.find(x=>x.id===id);const mods=[...document.querySelectorAll('[name="modifier-option"]:checked')].map(x=>x.value);const q=Math.max(1,Math.min(99,Number(document.getElementById('modifier-qty').value||1)));const note=document.getElementById('modifier-note').value.trim();if(note)mods.push(note);state.currentOrder.push({id:p.id,sku:p.sku,name:p.name,price:p.price,qty:q,modifiers:mods});closeModal();render()}
function ensureStockPermission(items){const demand={};for(const x of items)demand[x.id]=(demand[x.id]||0)+x.qty;const insufficient=Object.entries(demand).map(([id,q])=>({p:state.products.find(p=>p.id===id),q:Number(q)})).filter(x=>x.p&&x.p.stock<x.q);if(!insufficient.length)return true;const names=insufficient.map(x=>`${x.p.name} (on hand ${x.p.stock}, requested ${x.q})`).join(', ');if(state.role==='Manager'&&state.settings.allowNegativeStock){toast(`Manager override: insufficient stock for ${names}.`,false);return true}toast(`Insufficient stock: ${names}. A manager must enable/approve negative stock.`,false);return false}
function commitCurrentOrder(){if(!state.currentOrder.length)return null;if(!ensureStockPermission(state.currentOrder))return null;const total=cartTotal();const id=nextOrderNumber();const order={id,clientOrderId:crypto.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`,type:state.orderType,table:state.orderType==='Dine-in'?state.table:(state.table||state.orderType),tableGuestCount:state.orderType==='Dine-in'?Number(state.tableGuestCount||0):null,customerId:state.currentCustomerId||null,items:state.currentOrder.map(x=>({...x})),note:state.orderNote,total:total.total,subtotal:total.subtotal,tax:total.tax,payment:'Unpaid',paid:0,createdAt:new Date().toISOString(),status:'Saved',kitchen:'New',stockDeducted:true};state.products.forEach(p=>{const q=state.currentOrder.filter(x=>x.id===p.id).reduce((sum,x)=>sum+x.qty,0);if(q){p.stock-=q;state.stockHistory.unshift({date:new Date().toISOString(),sku:p.sku,name:p.name,change:-q,reason:'Order saved',orderId:id,by:state.user?.name||state.role})}});state.orders.unshift(order);state.currentOrder=[];state.orderNote='';state.currentCustomerId=null;state.tableGuestCount=2;persist();publishSyncEvent('order.saved',{order,products:state.products,stockHistory:state.stockHistory.slice(0,100)});return order}
function saveCurrentOrder(){const order=commitCurrentOrder();if(!order)return;render();showModal('Order saved',`<div style="text-align:center;padding:12px 0 18px"><div style="width:64px;height:64px;background:#e7f7ed;color:#168553;border-radius:50%;display:grid;place-items:center;font-size:26px;margin:0 auto 14px">${icon('check')}</div><h2 style="font:800 20px Manrope;margin:0 0 7px">Order #${order.id} saved!</h2><p class="muted" style="margin:0 0 17px">The order is now available in Orders, routed to kitchen, and its stock movement recorded.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left"><div style="background:#f2faf5;border-radius:11px;padding:12px">${icon('utensils')}<strong style="display:block;font-size:12px;margin-top:7px">Kitchen ticket</strong><small class="muted">${state.settings.autoKitchen?'Sent to kitchen queue':'Kitchen routing is off'}</small></div><div style="background:#f2faf5;border-radius:11px;padding:12px">${icon('boxes-stacked')}<strong style="display:block;font-size:12px;margin-top:7px">Inventory</strong><small class="muted">Stock updated once</small></div></div></div>`,`<button class="btn" data-action="close-modal">Back to Sell</button><button class="btn btn-primary" data-action="goto-order" data-id="${order.id}">View Order</button>`);toast('Order saved · kitchen and stock updated')}
function chargeCurrent(){if(!state.currentOrder.length)return;const order=commitCurrentOrder();if(!order)return;render();showPayment(order)}
function nextOrderNumber(){const n=Math.max(1041,...state.orders.map(o=>Number(o.id)||0))+1;return n}

function showPayment(order){let method='Cash';let received=order.total;let partialCash=0;window.__paymentOrder=order;window.__paymentMethod=method;window.__paymentReceived=received;window.__partialCash=partialCash;const content=()=>`<div class="payment-total"><div><div class="muted small">Amount to collect</div><strong>${money(order.total)}</strong></div><span class="pill pill-amber">Unpaid</span></div><div class="payment-methods">${[['Cash','money-bill-wave'],['Card','credit-card'],['GCash','mobile-screen-button'],['Split','layer-group']].map(([m,ic])=>`<button class="pay-method ${method===m?'active':''}" data-pay-method="${m}">${icon(ic)}${m}</button>`).join('')}</div><div id="payment-fields">${paymentFields(method,order,received,partialCash)}</div><div class="sync-banner" style="margin-top:15px"><i class="fa-solid fa-circle-info"></i><div><strong>Demo payment mode</strong><br>Completing this preview records a sample payment only. No card or GCash provider is connected.</div></div>`;showModal('Charge order',content(),`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="complete-payment" data-total="${order.total}">${icon('check')} Complete payment</button>`,true);}
function paymentFields(method,order,received,partialCash){if(method==='Cash')return `<div class="field"><label>Amount received</label><input id="amount-received" type="number" step="0.01" min="0" value="${Number(received).toFixed(2)}" /></div><div class="quick-cash">${[order.total,Math.ceil(order.total/50)*50,Math.ceil(order.total/100)*100,Math.ceil(order.total/500)*500].filter((x,i,a)=>x>=order.total&&a.indexOf(x)===i).map(x=>`<button data-cash-amount="${x}">${money(x)}</button>`).join('')}</div><div class="stat-line"><span>Change</span><strong id="change-due">${money(Math.max(0,received-order.total))}</strong></div>`;if(method==='Split')return `<div class="field"><label>Cash amount</label><input id="split-cash" type="number" value="${partialCash||0}" min="0" max="${order.total}" step="0.01" /></div><div class="field"><label>GCash amount</label><input id="split-gcash" type="number" value="${Math.max(0,order.total-(partialCash||0))}" min="0" step="0.01" /></div><div class="stat-line"><span>Remaining balance</span><strong id="split-balance">${money(0)}</strong></div><p class="small muted">Both portions must add up to the order total for this demo to mark it paid.</p>`;return `<div class="field"><label>${method} reference (optional demo field)</label><input id="payment-ref" placeholder="Enter provider reference if available" /></div><div class="sync-banner"><i class="fa-solid fa-shield-halved"></i><div>In production, card/GCash payments must be confirmed by the payment provider before the order is marked paid.</div></div>`}
function bindPaymentFields(){const order=window.__paymentOrder;document.querySelectorAll('[data-pay-method]').forEach(b=>b.addEventListener('click',()=>{window.__paymentMethod=b.dataset.payMethod;const wrap=document.getElementById('payment-fields');wrap.innerHTML=paymentFields(window.__paymentMethod,order,window.__paymentReceived,window.__partialCash);document.querySelectorAll('[data-pay-method]').forEach(x=>x.classList.toggle('active',x===b));bindPaymentFields()}));document.querySelectorAll('[data-cash-amount]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('amount-received').value=b.dataset.cashAmount;updateChange()}));const amount=document.getElementById('amount-received');if(amount)amount.addEventListener('input',updateChange);function updateChange(){const a=Number(amount?.value||0);document.getElementById('change-due').textContent=money(Math.max(0,a-order.total))}const cash=document.getElementById('split-cash'),gcash=document.getElementById('split-gcash');if(cash&&gcash){const update=()=>{gcash.value=Math.max(0,order.total-Number(cash.value||0)).toFixed(2);document.getElementById('split-balance').textContent=money(Math.max(0,order.total-Number(cash.value||0)-Number(gcash.value||0)))};cash.addEventListener('input',update);gcash.addEventListener('input',()=>{document.getElementById('split-balance').textContent=money(Math.max(0,order.total-Number(cash.value||0)-Number(gcash.value||0)))})}}
function completePayment(){const orderData=window.__paymentOrder,method=window.__paymentMethod||'Cash';if(window.MYPOS_CLOUD?.active&&method!=='Cash'){toast('Card, GCash and split payments cannot be cloud-confirmed until a verified payment provider is connected.',false);return}let received=orderData.total,paid=orderData.total,change=0;if(method==='Cash'){received=Number(document.getElementById('amount-received')?.value||0);if(received<orderData.total){toast('Amount received is below the order total.',false);return}change=received-orderData.total}else if(method==='Split'){const cash=Number(document.getElementById('split-cash')?.value||0),gcash=Number(document.getElementById('split-gcash')?.value||0);if(Math.abs(cash+gcash-orderData.total)>.009){toast('Split payments must equal the order total.',false);return}received=orderData.total;state.transactions.push({id:crypto.randomUUID?.()||String(Date.now()),type:'Payment',method:'Split (Cash + GCash)',amount:orderData.total,cash,gcash,date:new Date().toISOString(),orderId:orderData.id||'new'})}else{received=orderData.total;state.transactions.push({id:crypto.randomUUID?.()||String(Date.now()),type:'Payment',method,amount:orderData.total,date:new Date().toISOString(),orderId:orderData.id||'new'})}
let savedOrder;if(orderData.id){savedOrder=state.orders.find(o=>o.id===orderData.id);if(!savedOrder){toast('Order could not be found.',false);return}savedOrder.payment='Paid';savedOrder.paid=paid;savedOrder.paymentMethod=method;savedOrder.change=change;savedOrder.paidAt=new Date().toISOString();savedOrder.status='Paid'}else{const id=nextOrderNumber();savedOrder={id,clientOrderId:crypto.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`,type:orderData.type,table:orderData.table,tableGuestCount:orderData.type==='Dine-in'?Number(orderData.tableGuestCount||state.tableGuestCount||0):null,items:orderData.items,note:orderData.note,total:orderData.total,subtotal:orderData.subtotal,tax:orderData.tax,payment:'Paid',paid,paidAt:new Date().toISOString(),paymentMethod:method,change,createdAt:new Date().toISOString(),status:'Paid',kitchen:'New',stockDeducted:true};state.products.forEach(p=>{const q=orderData.items.filter(x=>x.id===p.id).reduce((s,x)=>s+x.qty,0);if(q){p.stock-=q;state.stockHistory.unshift({date:new Date().toISOString(),sku:p.sku,name:p.name,change:-q,reason:'Paid sale',orderId:id,by:state.user?.name||state.role})}});state.orders.unshift(savedOrder);state.currentOrder=[];state.orderNote=''}state.transactions.push({id:crypto.randomUUID?.()||String(Date.now()),type:'Sale',method,amount:paid,cash:method==='Cash'?paid:method==='Split'?Number(document.getElementById('split-cash')?.value||0):0,date:new Date().toISOString(),orderId:savedOrder.id,change});persist();publishSyncEvent('order.paid',{order:savedOrder,products:state.products,stockHistory:state.stockHistory.slice(0,100),transactions:state.transactions.filter(t=>String(t.orderId)===String(savedOrder.id))});closeModal();render();showModal('Payment confirmed',`<div style="text-align:center;padding:10px 0 20px"><div style="width:64px;height:64px;background:#e7f7ed;color:#168553;border-radius:50%;display:grid;place-items:center;font-size:26px;margin:0 auto 14px">${icon('check')}</div><h2 style="font:800 20px Manrope;margin:0 0 7px">Payment recorded</h2><p class="muted">Order #${savedOrder.id} · ${escapeHtml(method)} · ${money(savedOrder.total)}</p><div style="background:#f5faf7;padding:13px;border-radius:10px;text-align:left;margin-top:18px"><div class="stat-line"><span>Order state</span><strong>Paid</strong></div><div class="stat-line"><span>Kitchen state</span><strong>${escapeHtml(savedOrder.kitchen)}</strong></div>${method==='Cash'?`<div class="stat-line"><span>Change due</span><strong>${money(change)}</strong></div>`:''}</div><p class="small muted" style="text-align:left;margin-top:14px">Receipt printing is not connected in this preview.</p></div>`,`<button class="btn" data-action="close-modal">Done</button><button class="btn btn-primary" data-action="preview-receipt" data-id="${savedOrder.id}">${icon('receipt')} Preview receipt</button>`);toast('Payment recorded in local preview')}
function formatTime(v){if(!v)return '—';try{return new Date(v).toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'})}catch(e){return '—'}}
function formatDate(v){if(!v)return '—';try{return new Date(v).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}catch(e){return '—'}}

function requestOrderCommit(mode){if(!state.currentOrder.length)return;if(state.orderType==='Dine-in'){dineInDetailsDialog(mode);return}if(mode==='charge')chargeCurrent();else saveCurrentOrder()}
function dineInDetailsDialog(mode){const useTableManager=state.settings.tableManagementEnabled!==false;const candidates=state.tables||[];const selected=candidates.some(t=>t.name===state.table)?state.table:'';const tableField=useTableManager?`<div class="field"><label>Table number <span style="color:var(--red)">*</span></label><select id="dinein-table"><option value="">Select a table</option>${candidates.map(t=>`<option value="${escapeHtml(t.name)}" ${selected===t.name?'selected':''} ${['Reserved','Cleaning'].includes(t.manualStatus)?'disabled':''}>${escapeHtml(t.name)} · ${escapeHtml(t.section||'Main Dining')}${t.manualStatus&&t.manualStatus!=='Available'?` · ${escapeHtml(t.manualStatus)}`:''}</option>`).join('')}</select><small class="muted">Reserved or cleaning tables cannot start a new order.</small></div>`:`<div class="field"><label>Table number <span style="color:var(--red)">*</span></label><input id="dinein-table" value="${escapeHtml(state.table||'')}" placeholder="e.g. Table 3" /></div>`;showModal('Dine-in details',`<div class="role-banner"><i class="fa-solid fa-utensils"></i><div><strong>Dine-in order</strong><small>Assign a table and enter the number of customers before continuing.</small></div></div>${tableField}<div class="field"><label>Customers at the table ${state.settings.requireGuestCount!==false?'<span style="color:var(--red)">*</span>':'<span class="muted">(optional)</span>'}</label><input id="dinein-guests" type="number" min="1" max="100" step="1" value="${Math.max(1,Number(state.tableGuestCount||2))}" /></div><div class="sync-banner"><i class="fa-solid fa-circle-info"></i><div>Saving commits the ticket to kitchen and records its stock movement. Payment remains separate.</div></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="confirm-dinein-commit" data-mode="${mode}">${icon(mode==='charge'?'wallet':'floppy-disk')} ${mode==='charge'?'Continue to Charge':'Save Order'}</button>`)}
function confirmDineInCommit(mode){const field=document.getElementById('dinein-table');const tableName=(field?.value||'').trim();const guests=Number(document.getElementById('dinein-guests')?.value||0);if(!tableName){toast('Choose or enter a table number.',false);return}if((state.settings.requireGuestCount!==false||guests>0)&&(!Number.isInteger(guests)||guests<1||guests>100)){toast('Enter a valid customer count from 1 to 100.',false);return}if(state.settings.tableManagementEnabled!==false){const t=state.tables.find(t=>t.name===tableName);if(!t){toast('That table is not in Table Management.',false);return}if(['Reserved','Cleaning'].includes(t.manualStatus)){toast(`${t.name} is marked ${t.manualStatus.toLowerCase()} and cannot receive a new order.`,false);return}const open=state.orders.find(o=>o.type==='Dine-in'&&o.table===tableName&&o.status!=='Cancelled'&&o.status!=='Completed'&&o.kitchen!=='Completed');if(open&&state.settings.allowMultipleOrdersPerTable===false){toast(`${tableName} already has an active order. Choose another table.`,false);return}}state.table=tableName;state.tableGuestCount=guests||0;closeModal();if(mode==='charge')chargeCurrent();else saveCurrentOrder()}
function activeOrdersForTable(tableName){return state.orders.filter(o=>o.type==='Dine-in'&&o.table===tableName&&o.status!=='Cancelled'&&o.status!=='Completed'&&o.kitchen!=='Completed')}
function tableDisplayStatus(t){const active=activeOrdersForTable(t.name);if(active.length)return 'Occupied';return t.manualStatus||'Available'}
function tableManagementPage(){if(state.settings.tableManagementEnabled===false)return head('Table Management','Table management is disabled in Settings.','<button class="btn" data-action="open-table-settings">Open settings</button>');const tables=state.tables||[];const occupied=tables.filter(t=>tableDisplayStatus(t)==='Occupied').length;const available=tables.filter(t=>tableDisplayStatus(t)==='Available').length;const reserved=tables.filter(t=>tableDisplayStatus(t)==='Reserved').length;return `${head('Table Management','View table occupancy, start dine-in orders, and track guest counts.',`<button class="btn" data-action="add-table">${icon('plus')} Add table</button><button class="btn btn-primary" data-action="begin-dinein-order">${icon('cash-register')} New dine-in order</button>`)}<div class="kpi-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="card kpi"><div class="kpi-top">Available <span class="kpi-icon">${icon('check')}</span></div><div class="kpi-value">${available}</div><div class="kpi-foot">Ready for guests</div></div><div class="card kpi"><div class="kpi-top">Occupied <span class="kpi-icon">${icon('users')}</span></div><div class="kpi-value">${occupied}</div><div class="kpi-foot">Active dine-in tickets</div></div><div class="card kpi"><div class="kpi-top">Reserved / cleaning <span class="kpi-icon">${icon('calendar-check')}</span></div><div class="kpi-value">${reserved+tables.filter(t=>tableDisplayStatus(t)==='Cleaning').length}</div><div class="kpi-foot">Unavailable tables</div></div></div><div class="table-grid">${tables.map(t=>{const active=activeOrdersForTable(t.name);const status=tableDisplayStatus(t);const cls=status==='Occupied'?'occupied':status==='Available'?'available':status==='Reserved'?'reserved':'cleaning';const guests=active.reduce((max,o)=>Math.max(max,Number(o.tableGuestCount||0)),0);const total=active.reduce((sum,o)=>sum+Number(o.total||0),0);return `<article class="table-card ${cls}"><div class="table-card-head"><div class="table-icon">${icon('utensils')}</div><span class="pill ${status==='Available'?'pill-green':status==='Occupied'?'pill-amber':'pill-gray'}">${status}</span></div><h3>${escapeHtml(t.name)}</h3><div class="table-meta">${escapeHtml(t.section||'Main Dining')} · Capacity ${Number(t.capacity||4)}</div><div class="table-card-stats"><div><span>Guests</span><strong>${guests||'—'}</strong></div><div><span>Open orders</span><strong>${active.length}</strong></div><div><span>Order total</span><strong>${money(total)}</strong></div></div><div class="table-card-actions">${active.length?`<button class="btn btn-primary btn-sm" data-action="view-order" data-id="${active[0].id}">View order</button>`:`<button class="btn btn-primary btn-sm" data-action="start-table-order" data-id="${t.id}" ${['Reserved','Cleaning'].includes(status)?'disabled':''}>Start order</button>`}<button class="btn btn-sm" data-action="table-status" data-id="${t.id}">Status</button></div></article>`}).join('')}</div><div class="sync-banner" style="margin-top:16px"><i class="fa-solid fa-bolt"></i><div>Table and order changes are saved locally and emit action-based sync events. Live cross-device syncing still requires the cloud adapter.</div></div>`}
function tableStatusDialog(id){const t=state.tables.find(t=>t.id===Number(id));if(!t)return;showModal('Table status',`<div class="role-banner"><i class="fa-solid fa-table-cells"></i><div><strong>${escapeHtml(t.name)}</strong><small>Active orders automatically mark a table occupied.</small></div></div><div class="field"><label>Table name / number</label><input id="table-name" value="${escapeHtml(t.name)}" /></div><div class="field"><label>Manual status</label><select id="table-manual-status">${['Available','Reserved','Cleaning'].map(x=>`<option ${t.manualStatus===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Section</label><input id="table-section" value="${escapeHtml(t.section||'Main Dining')}" /></div><div class="field"><label>Capacity</label><input id="table-capacity" type="number" min="1" max="100" value="${Number(t.capacity||4)}" /></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="save-table-status" data-id="${t.id}">Save table</button>`)}
function saveTableStatus(id){const t=state.tables.find(t=>t.id===Number(id));if(!t)return;const oldName=t.name;const name=document.getElementById('table-name').value.trim();const status=document.getElementById('table-manual-status').value;const section=document.getElementById('table-section').value.trim()||'Main Dining';const capacity=Number(document.getElementById('table-capacity').value||0);if(!name){toast('Enter a table name.',false);return}if(state.tables.some(x=>x.id!==t.id&&x.name.toLowerCase()===name.toLowerCase())){toast('A table with that name already exists.',false);return}if(name!==oldName&&activeOrdersForTable(oldName).length){toast('Finish active orders before renaming this table.',false);return}if(!Number.isInteger(capacity)||capacity<1||capacity>100){toast('Capacity must be between 1 and 100.',false);return}t.name=name;t.manualStatus=status;t.section=section;t.capacity=capacity;state.settings.tableCount=state.tables.length;persist();publishSyncEvent('tables.updated',{tables:state.tables,settings:{tableCount:state.settings.tableCount}});closeModal();render();toast(`${t.name} updated`)}
function addTableDialog(){showModal('Add table',`<div class="field"><label>Table name</label><input id="new-table-name" placeholder="e.g. Patio 1" /></div><div class="two-fields"><div class="field"><label>Capacity</label><input id="new-table-capacity" type="number" min="1" max="100" value="${Number(state.settings.defaultTableCapacity||4)}" /></div><div class="field"><label>Section</label><input id="new-table-section" value="Main Dining" /></div></div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="save-new-table">${icon('plus')} Add table</button>`)}
function saveNewTable(){const name=document.getElementById('new-table-name').value.trim();const capacity=Number(document.getElementById('new-table-capacity').value||0);const section=document.getElementById('new-table-section').value.trim()||'Main Dining';if(!name){toast('Enter a table name.',false);return}if(state.tables.some(t=>t.name.toLowerCase()===name.toLowerCase())){toast('A table with that name already exists.',false);return}if(!Number.isInteger(capacity)||capacity<1||capacity>100){toast('Capacity must be between 1 and 100.',false);return}const id=Math.max(0,...state.tables.map(t=>Number(t.id)||0))+1;state.tables.push({id,name,capacity,section,manualStatus:'Available'});state.settings.tableCount=state.tables.length;persist();publishSyncEvent('tables.updated',{tables:state.tables,settings:{tableCount:state.settings.tableCount}});closeModal();render();toast(`${name} added`)}
function startTableOrder(id){const t=state.tables.find(t=>t.id===Number(id));if(!t)return;if(state.currentOrder.length&&(state.orderType!=='Dine-in'||state.table!==t.name)){toast('Save the current draft before switching to another table.',false);return}const status=tableDisplayStatus(t);if(['Reserved','Cleaning'].includes(status)){toast(`${t.name} is ${status.toLowerCase()}.`,false);return}state.orderType='Dine-in';state.table=t.name;state.tableGuestCount=2;state.page='Sell';persist();render();toast(`${t.name} selected · add products to begin`)}

function ordersPage(){const filter=state.ordersFilter||'All';const orders=state.orders.filter(o=>filter==='All'||(filter==='Saved'&&o.status==='Saved')||(filter==='Unpaid'&&o.payment!=='Paid')||(filter==='Paid'&&o.payment==='Paid')||(filter==='Preparing'&&o.kitchen==='Preparing')||(filter==='Ready'&&o.kitchen==='Ready')||(filter==='Completed'&&o.kitchen==='Completed'));const kitchenOnly=state.role==='Kitchen';return `${head('Orders',kitchenOnly?'Track tickets assigned to kitchen and update preparation status.':'Find, reopen, charge, and track saved orders.',kitchenOnly?'':`<button class="btn btn-primary" data-nav="Sell">${icon('plus')} New order</button>`)}<div class="card"><div class="card-head"><div><h2>Order history</h2><p>${state.orders.length} order${state.orders.length===1?'':'s'} on this device</p></div><div class="filter-row">${(kitchenOnly?['All','Preparing','Ready','Completed']:['All','Saved','Unpaid','Paid','Preparing','Ready','Completed']).map(x=>`<button class="filter-btn ${filter===x?'active':''}" data-orders-filter="${x}">${x}</button>`).join('')}</div></div>${orders.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Type / table</th><th>Kitchen</th>${kitchenOnly?'':'<th>Payment</th><th>Total</th>'}<th>Time</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td><span class="order-title">#${o.id}</span><span class="order-sub">${o.items.reduce((s,x)=>s+x.qty,0)} items</span></td><td>${escapeHtml(o.type||'Takeout')}<span class="order-sub">${escapeHtml(o.table||'')}${o.tableGuestCount?` · ${Number(o.tableGuestCount)} guests`:''}</span></td><td>${statusPill(o.kitchen)}</td>${kitchenOnly?'':`<td>${statusPill(o.payment)}</td><td><strong>${money(o.total)}</strong></td>`}<td>${formatTime(o.createdAt)}<span class="order-sub">${formatDate(o.createdAt)}</span></td><td><button class="btn btn-sm" data-action="view-order" data-id="${o.id}">View</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty-state">${icon('clipboard-list')}<div>No matching orders</div><p class="small">Saved orders will appear here.</p></div>`}</div>`}
function statusPill(s){const k=String(s||'').toLowerCase();let c='pill-gray';if(['paid','ready','served','completed','active','sent'].includes(k))c='pill-green';if(['saved','unpaid','new','open','pending'].includes(k))c='pill-amber';if(['preparing','in preparation'].includes(k))c='pill-blue';if(['cancelled','failed','void'].includes(k))c='pill-red';return `<span class="pill ${c}">${escapeHtml(s||'—')}</span>`}
function kitchenPage(){const all=state.orders.filter(o=>!['Completed','Cancelled'].includes(o.kitchen));const groups=[['New',all.filter(o=>['New','Sent'].includes(o.kitchen))],['Preparing',all.filter(o=>o.kitchen==='Preparing')],['Ready',all.filter(o=>o.kitchen==='Ready')],['Served',all.filter(o=>o.kitchen==='Served')]];return `${head('Kitchen display','Move each ticket through preparation without changing its payment status.',`<span class="pill pill-green">${all.length} active tickets</span><span class="pill pill-gray">Event-driven · no polling</span>`)}<div class="sync-banner" style="margin-bottom:15px"><i class="fa-solid fa-bolt"></i><div><strong>Action-based ticket updates · no polling</strong><br>Saved orders appear when a cashier commits an order. Kitchen status changes sync as events; unfinished carts stay off the KDS. Cross-device delivery requires the cloud adapter to be connected.</div></div><div class="kds-board">${groups.map(([label,items])=>`<section class="kds-col"><div class="kds-col-head"><span>${label==='New'?'New tickets':label}</span><span class="kds-count">${items.length}</span></div>${items.length?items.map(o=>`<article class="kds-ticket"><div class="ticket-head"><span>#${o.id}<small class="ticket-time" style="display:block">${escapeHtml(o.type||'Takeout')}${o.type==='Dine-in'&&o.table?` · ${escapeHtml(o.table)}${o.tableGuestCount?` · ${Number(o.tableGuestCount)} guests`:''}`:''} · ${formatTime(o.createdAt)}</small></span>${statusPill(o.payment)}</div><div class="ticket-items">${o.items.map(it=>`<div class="ticket-item"><span>${it.qty}×</span><span>${escapeHtml(it.name)}${it.modifiers?.length?`<small class="muted" style="display:block;margin-top:2px">${escapeHtml(it.modifiers.join(', '))}</small>`:''}</span></div>`).join('')}</div>${o.note?`<div class="ticket-note">${icon('note-sticky')} ${escapeHtml(o.note)}</div>`:''}<div class="ticket-actions">${label==='New'?`<button class="btn btn-primary btn-sm" data-action="kitchen-status" data-id="${o.id}" data-status="Preparing">${icon('play')} Start</button>`:label==='Preparing'?`<button class="btn btn-primary btn-sm" data-action="kitchen-status" data-id="${o.id}" data-status="Ready">${icon('check')} Ready</button>`:label==='Ready'?`<button class="btn btn-primary btn-sm" data-action="kitchen-status" data-id="${o.id}" data-status="Served">${icon('bell-concierge')} Served</button>`:`<button class="btn btn-sm" data-action="view-order" data-id="${o.id}">View ticket</button>`}</div></article>`).join(''):`<div style="padding:22px 7px;text-align:center;color:#94a198;font-size:11px">No tickets here</div>`}</section>`).join('')}</div>`}
function inventoryPage(){const search=state.inventorySearch||'';const products=state.products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(search.toLowerCase()));const low=state.products.filter(p=>p.stock<=p.lowStock).length;return `${head('Inventory','Update stock, review low-stock items, and audit adjustments.',`<button class="btn" data-action="stock-export">${icon('download')} Export CSV</button><button class="btn btn-primary" data-action="stock-adjust">${icon('sliders')} Stock adjustment</button>`)}<div class="kpi-grid"><div class="card kpi"><div class="kpi-top">Catalog products <span class="kpi-icon">${icon('boxes-stacked')}</span></div><div class="kpi-value">${state.products.length}</div><div class="kpi-foot">Active products</div></div><div class="card kpi"><div class="kpi-top">Low stock <span class="kpi-icon" style="background:#fff4df;color:#b66a10">${icon('triangle-exclamation')}</span></div><div class="kpi-value">${low}</div><div class="kpi-foot">At or below threshold</div></div><div class="card kpi"><div class="kpi-top">Units on hand <span class="kpi-icon">${icon('cube')}</span></div><div class="kpi-value">${state.products.reduce((s,p)=>s+p.stock,0)}</div><div class="kpi-foot">Across tracked products</div></div><div class="card kpi"><div class="kpi-top">Stock movements <span class="kpi-icon">${icon('arrow-right-arrow-left')}</span></div><div class="kpi-value">${state.stockHistory.length}</div><div class="kpi-foot">Audited adjustments</div></div></div><div class="inventory-layout"><section class="card"><div class="card-head"><div><h2>Stock on hand</h2><p>All products initialize at 10 in this preview; quantities update when orders are saved.</p></div><label class="searchbox" style="max-width:250px;height:36px">${icon('magnifying-glass')}<input id="inventory-search" placeholder="Search products" value="${escapeHtml(search)}" /></label></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>In stock</th><th>Threshold</th><th>Status</th><th>Adjust</th></tr></thead><tbody>${products.map(p=>`<tr><td><div class="stock-row"><img class="stock-img" src="${FOOD_IMAGES[p.imageIndex%FOOD_IMAGES.length]}" alt=""/><div class="stock-copy"><strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.sku)} · ${escapeHtml(p.category)}</small></div></div></td><td><strong>${p.stock}</strong></td><td>${p.lowStock}</td><td>${p.stock<=p.lowStock?'<span class="pill pill-amber">Low stock</span>':'<span class="pill pill-green">In stock</span>'}</td><td><div class="stock-actions"><button data-stock="-1" data-id="${p.id}" aria-label="Subtract one">−</button><button data-stock="1" data-id="${p.id}" aria-label="Add one">+</button></div></td></tr>`).join('')}</tbody></table></div></section><aside class="card"><div class="card-head"><div><h2>Recent stock history</h2><p>Latest movements and adjustments</p></div></div><div class="card-body">${state.stockHistory.slice(0,9).length?state.stockHistory.slice(0,9).map(h=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #edf2ee"><span style="width:31px;height:31px;background:${h.change<0?'#fff0ed':'#e5f7ed'};color:${h.change<0?'#c54b3f':'#1d8956'};border-radius:9px;display:grid;place-items:center;flex-shrink:0">${icon(h.change<0?'arrow-down':'arrow-up')}</span><div style="flex:1"><strong style="display:block;font-size:11px">${escapeHtml(h.name)}</strong><small class="muted">${escapeHtml(h.reason)} · ${formatTime(h.date)}</small></div><strong style="color:${h.change<0?'#bd4a41':'#17834f'}">${h.change>0?'+':''}${h.change}</strong></div>`).join(''):`<div class="empty-orders">No stock movement yet.</div>`}</div></aside></div>`}
function customersPage(){return `${head('Customers','A simple customer book for repeat orders and service history.',`<button class="btn btn-primary" data-action="add-customer">${icon('user-plus')} Add customer</button>`)}<div class="kpi-grid"><div class="card kpi"><div class="kpi-top">Customers <span class="kpi-icon">${icon('users')}</span></div><div class="kpi-value">${state.customers.length}</div><div class="kpi-foot">Saved customer profiles</div></div><div class="card kpi"><div class="kpi-top">Orders linked <span class="kpi-icon">${icon('receipt')}</span></div><div class="kpi-value">${state.orders.filter(o=>o.customerId).length}</div><div class="kpi-foot">Orders tied to a profile</div></div></div><div class="card"><div class="card-head"><div><h2>Customer directory</h2><p>Name and contact details saved on this device</p></div><label class="searchbox" style="max-width:250px;height:36px">${icon('magnifying-glass')}<input id="customer-search" placeholder="Search customers" /></label></div><div id="customer-table">${customerTable()}</div></div>`}
function customerTable(){if(!state.customers.length)return `<div class="empty-state">${icon('users')}<div>No customers added yet</div><p class="small">Add a customer to link an order to their profile.</p></div>`;return `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Orders</th><th></th></tr></thead><tbody>${state.customers.map(c=>`<tr><td><strong>${escapeHtml(c.name)}</strong></td><td>${escapeHtml(c.phone||'—')}</td><td>${escapeHtml(c.email||'—')}</td><td>${state.orders.filter(o=>o.customerId===c.id).length}</td><td><button class="btn btn-sm" data-action="edit-customer" data-id="${c.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function reportsPage(){const paid=state.orders.filter(o=>o.payment==='Paid');const sales=paid.reduce((s,o)=>s+o.total,0);const tax=paid.reduce((s,o)=>s+(o.tax||0),0);const today=paid.filter(o=>new Date(o.paidAt||o.createdAt).toDateString()===new Date().toDateString());const methods=['Cash','Card','GCash','Split'];const byMethod=methods.map(m=>({m,amount:state.transactions.filter(t=>t.type==='Sale'&&t.method===m).reduce((s,t)=>s+t.amount,0)}));const max=Math.max(1,...byMethod.map(x=>x.amount));return `${head('Reports','Sales, payments, discounts, and cash movements for this device.',`<button class="btn" data-action="report-export">${icon('download')} Export report</button><button class="btn btn-primary" data-action="shift-report">${icon('printer')} Shift report</button>`)}<div class="kpi-grid"><div class="card kpi"><div class="kpi-top">Net sales <span class="kpi-icon">${icon('chart-line')}</span></div><div class="kpi-value">${money(sales-tax)}</div><div class="kpi-foot"><strong>${today.length} paid today</strong> in this preview</div></div><div class="card kpi"><div class="kpi-top">Gross sales <span class="kpi-icon">${icon('coins')}</span></div><div class="kpi-value">${money(sales)}</div><div class="kpi-foot">Confirmed demo transactions</div></div><div class="card kpi"><div class="kpi-top">Paid orders <span class="kpi-icon">${icon('receipt')}</span></div><div class="kpi-value">${paid.length}</div><div class="kpi-foot">Unpaid orders excluded</div></div><div class="card kpi"><div class="kpi-top">Tax collected <span class="kpi-icon">${icon('file-invoice-dollar')}</span></div><div class="kpi-value">${money(tax)}</div><div class="kpi-foot">At configured rate of ${state.settings.taxRate}%</div></div></div><div class="report-grid"><section class="card report-card"><h3>Payment method summary</h3>${byMethod.map(x=>`<div class="bar-row"><span>${x.m}</span><div class="bar-track"><div class="bar-fill" style="width:${x.amount/max*100}%"></div></div><strong style="text-align:right">${money(x.amount)}</strong></div>`).join('')}</section><section class="card report-card"><h3>Sales summary</h3><div class="stat-line"><span>Total sales</span><strong>${money(sales)}</strong></div><div class="stat-line"><span>Net sales (less tax)</span><strong>${money(sales-tax)}</strong></div><div class="stat-line"><span>Unpaid orders</span><strong>${money(state.orders.filter(o=>o.payment!=='Paid').reduce((s,o)=>s+o.total,0))}</strong></div><div class="stat-line"><span>Stock adjustments</span><strong>${state.stockHistory.length}</strong></div></section><section class="card report-card"><h3>Recent transactions</h3>${state.transactions.slice(-6).reverse().length?state.transactions.slice(-6).reverse().map(t=>`<div class="stat-line"><span>${escapeHtml(t.method)} · #${t.orderId}<small class="muted" style="display:block">${formatDate(t.date)} ${formatTime(t.date)}</small></span><strong>${money(t.amount)}</strong></div>`).join(''):`<div class="empty-orders">No payment transactions recorded.</div>`}</section><section class="card report-card"><h3>Reporting coverage</h3><div class="setting-row"><div><strong>Shift close report</strong><small>Includes cash/card/GCash, sales, discounts, and drawer reconciliation.</small></div><button class="btn btn-sm" data-action="shift-report">Open</button></div><div class="setting-row"><div><strong>Export</strong><small>Download demo report rows as CSV.</small></div><button class="btn btn-sm" data-action="report-export">Export</button></div><div class="footer-note">Production reports require persisted transactions and payment-provider reconciliation.</div></section></div>`}
function shiftPage(){const paid=state.orders.filter(o=>o.payment==='Paid'&&(!state.shift.openedAt||new Date(o.paidAt||o.createdAt)>=new Date(state.shift.openedAt)));const cashSales=paid.filter(o=>['Cash','Split'].includes(o.paymentMethod)).reduce((s,o)=>s+(o.paymentMethod==='Split'?Number(state.transactions.find(t=>t.orderId===o.id&&t.method==='Split')?.cash||0):o.total),0);const cardSales=paid.filter(o=>o.paymentMethod==='Card').reduce((s,o)=>s+o.total,0);const gcashSales=paid.filter(o=>o.paymentMethod==='GCash').reduce((s,o)=>s+o.total,0);const opening=Number(state.shift.openingAmount||0);const expected=opening+cashSales;return `${head('Shift & Cash','Open a shift, manage drawer movements, and close with reconciliation.',`<span class="pill ${state.shift.open?'pill-green':'pill-gray'}">${state.shift.open?'Shift open':'Shift closed'}</span>`)}<div class="content-grid"><section class="card"><div class="card-head"><div><h2>Current shift</h2><p>${state.shift.open?'Open session and live totals':'No active shift on this device'}</p></div>${state.shift.open?'<span class="pill pill-green">OPEN</span>':'<span class="pill pill-gray">CLOSED</span>'}</div><div class="card-body">${state.shift.open?`<div class="role-banner"><i class="fa-solid fa-clock"></i><div><strong>Shift #${String(state.shift.id).padStart(3,'0')}</strong><small>Opened by ${escapeHtml(state.shift.employee)} · ${formatDate(state.shift.openedAt)} at ${formatTime(state.shift.openedAt)}</small></div></div><div class="kpi-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card kpi"><div class="kpi-top">Cash sales</div><div class="kpi-value" style="font-size:20px">${money(cashSales)}</div></div><div class="card kpi"><div class="kpi-top">Card sales</div><div class="kpi-value" style="font-size:20px">${money(cardSales)}</div></div><div class="card kpi"><div class="kpi-top">GCash sales</div><div class="kpi-value" style="font-size:20px">${money(gcashSales)}</div></div><div class="card kpi"><div class="kpi-top">Expected drawer</div><div class="kpi-value" style="font-size:20px">${money(expected)}</div></div></div><div class="divider"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-outline-green" data-action="cash-movement" data-type="Pay In">${icon('circle-plus')} Pay In</button><button class="btn" data-action="cash-movement" data-type="Pay Out">${icon('circle-minus')} Pay Out</button><button class="btn" data-action="open-drawer">${icon('cash-register')} Open Cash Drawer</button><button class="btn" data-action="shift-report">${icon('file-lines')} X-Report</button></div><div class="divider"></div><button class="btn btn-primary btn-wide" data-action="close-shift">${icon('lock')} Close Shift & Reconcile</button>`:`<div class="empty-state">${icon('lock')}<div>No active shift</div><p class="small">Open a shift with an opening cash float before taking sales.</p><button class="btn btn-primary" data-action="open-shift">${icon('play')} Open Shift</button></div>`}</div></section><section class="card"><div class="card-head"><div><h2>Cash drawer controls</h2><p>Manual opening is not a cash transaction.</p></div></div><div class="card-body"><div class="setting-row"><div><strong>Opening amount</strong><small>Starting cash float for this shift</small></div><strong>${money(opening)}</strong></div><div class="setting-row"><div><strong>Cash sales retained</strong><small>Cash payments less change given</small></div><strong>${money(cashSales)}</strong></div><div class="setting-row"><div><strong>Pay-ins</strong><small>Recorded cash added to drawer</small></div><strong>${money(state.transactions.filter(t=>t.type==='Pay In').reduce((s,t)=>s+t.amount,0))}</strong></div><div class="setting-row"><div><strong>Pay-outs</strong><small>Recorded cash removed from drawer</small></div><strong>${money(state.transactions.filter(t=>t.type==='Pay Out').reduce((s,t)=>s+t.amount,0))}</strong></div><div class="setting-row"><div><strong>Cash refunds</strong><small>Recorded cash returned</small></div><strong>${money(state.transactions.filter(t=>t.type==='Refund'&&t.method==='Cash').reduce((s,t)=>s+t.amount,0))}</strong></div><div class="sync-banner" style="margin-top:15px"><i class="fa-solid fa-circle-info"></i><div>Only confirmed cash transactions affect the drawer. Card and GCash never increase physical cash.</div></div></div></section></div><section class="card" style="margin-top:16px"><div class="card-head"><div><h2>Recent cash movements</h2><p>Audit trail for Pay In, Pay Out, and drawer actions</p></div></div><div class="table-wrap">${state.transactions.filter(t=>['Pay In','Pay Out','Drawer Open'].includes(t.type)).length?`<table><thead><tr><th>Type</th><th>Reason</th><th>Employee</th><th>Time</th><th>Amount</th></tr></thead><tbody>${state.transactions.filter(t=>['Pay In','Pay Out','Drawer Open'].includes(t.type)).slice().reverse().map(t=>`<tr><td>${escapeHtml(t.type)}</td><td>${escapeHtml(t.reason||'—')}</td><td>${escapeHtml(t.by||state.role)}</td><td>${formatDate(t.date)} ${formatTime(t.date)}</td><td>${t.amount?money(t.amount):'—'}</td></tr>`).join('')}</tbody></table>`:`<div class="empty-orders">No movements recorded yet.</div>`}</div></section>`}
function teamPage(){return `${head('Team & permissions','Manage staff roles, create PINs, and restrict screens by job.',`<button class="btn btn-primary" data-action="add-staff">${icon('user-plus')} Add staff member</button>`)}<div class="kpi-grid"><div class="card kpi"><div class="kpi-top">Team members <span class="kpi-icon">${icon('users')}</span></div><div class="kpi-value">${state.staff.length}</div><div class="kpi-foot">Staff profiles on this device</div></div><div class="card kpi"><div class="kpi-top">PIN enabled <span class="kpi-icon">${icon('shield-halved')}</span></div><div class="kpi-value">${state.staff.filter(s=>s.pin).length}</div><div class="kpi-foot">Local preview PINs assigned</div></div><div class="card kpi"><div class="kpi-top">Roles <span class="kpi-icon">${icon('user-gear')}</span></div><div class="kpi-value">3</div><div class="kpi-foot">Kitchen · Cashier · Manager</div></div><div class="card kpi"><div class="kpi-top">PIN policy <span class="kpi-icon">${icon('key')}</span></div><div class="kpi-value" style="font-size:21px">${state.settings.requirePin?'Required':'Optional'}</div><div class="kpi-foot">Controlled in Settings</div></div></div><div class="content-grid"><section class="card"><div class="card-head"><div><h2>Staff members</h2><p>Edit role, change PIN, or deactivate access.</p></div></div><div class="card-body"><div class="staff-list">${state.staff.map(s=>`<div class="staff-row"><span class="avatar" style="width:39px;height:39px">${escapeHtml(s.name.slice(0,1).toUpperCase())}</span><div class="staff-info"><strong>${escapeHtml(s.name)}</strong><small>${escapeHtml(s.email||'No email added')} · ${s.status==='Active'?'Active':'Inactive'}</small></div><span class="role-chip">${escapeHtml(s.role)}</span><button class="icon-btn" data-action="edit-staff" data-id="${s.id}" title="Edit staff">${icon('ellipsis')}</button></div>`).join('')}</div></div></section><section class="card"><div class="card-head"><div><h2>Role access matrix</h2><p>Only the necessary sections show for each staff role.</p></div></div><div class="table-wrap"><table><thead><tr><th>Section</th><th>Kitchen</th><th>Cashier</th><th>Manager</th></tr></thead><tbody>${[['Kitchen display','Edit','View','Manage'],['Sell / charge','—','✓','✓'],['Orders','Kitchen only','✓','✓'],['Inventory','—','—','✓'],['Customers','—','✓','✓'],['Reports','—','—','✓'],['Shift & cash','—','Own shift','✓'],['Team & PINs','—','—','✓'],['Settings','Limited','Limited','✓']].map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(x=>`<td>${x==='—'?'<span class="muted">—</span>':x==='✓'?'<span style="color:#168653;font-weight:800">✓</span>':`<span class="small">${x}</span>`}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="card-body"><div class="sync-banner"><i class="fa-solid fa-lock"></i><div>In production, screen hiding must be backed by server-side authorization. This local prototype demonstrates the role-specific UI only.</div></div></div></section></div>`}
function settingsPage(){const allTabs=[['General','sliders'],['Table Management','table-cells'],['Security & PINs','key'],['Account & Sync','cloud'],['Products & Modifiers','list-check'],['Printer & Receipts','print'],['Shift & Cash','cash-register']];const tabs=state.role==='Manager'?allTabs:[['My account','user'],['Security & PINs','key']];if(state.role!=='Manager')state.activeSettings='My account';else if(!allTabs.some(t=>t[0]===state.activeSettings))state.activeSettings='General';return `${head('Settings','Configure your store, security, table management, cloud account, and hardware.',`<button class="btn btn-primary" data-action="save-settings">${icon('floppy-disk')} Save settings</button>`)}<div class="setting-layout"><aside class="card settings-nav">${tabs.map(([t,i])=>`<button class="${state.activeSettings===t?'active':''}" data-settings-tab="${t}">${icon(i)}${t}</button>`).join('')}</aside><section class="card settings-section">${settingsContent()}</section></div>`}
function settingsContent(){switch(state.activeSettings){case'Table Management':return tableManagementSettings();case'Security & PINs':return securitySettings();case'Account & Sync':return syncSettings();case'Products & Modifiers':return modifierSettings();case'Printer & Receipts':return printerSettings();case'Shift & Cash':return shiftSettings();default:return generalSettings()}}
function tableManagementSettings(){return `<h2>Table Management</h2><p>Configure the dine-in floor plan and how table details are collected at order save.</p>${settingToggle('Enable Table Management','Show the table overview to managers and cashiers. When disabled, table names can still be entered manually.','tableManagementEnabled',state.settings.tableManagementEnabled!==false)}<div class="two-fields"><div class="field"><label>Number of tables</label><input id="cfg-table-count" type="number" min="1" max="100" value="${state.tables.length}" /></div><div class="field"><label>Default table capacity</label><input id="cfg-table-capacity" type="number" min="1" max="100" value="${Number(state.settings.defaultTableCapacity||4)}" /></div></div><div class="field"><label>Default order type</label><select id="cfg-default-order-type"><option value="Dine-in" ${state.settings.defaultOrderType==='Dine-in'?'selected':''}>Dine-in</option><option value="Takeout" ${state.settings.defaultOrderType==='Takeout'?'selected':''}>Takeout</option><option value="Delivery" ${state.settings.defaultOrderType==='Delivery'?'selected':''}>Delivery</option></select></div>${settingToggle('Require customer count at save','Ask how many guests are seated at the table before saving or charging a dine-in order.','requireGuestCount',state.settings.requireGuestCount!==false)}${settingToggle('Allow multiple open orders per table','Useful for separate courses or multiple checks at one table.','allowMultipleOrdersPerTable',state.settings.allowMultipleOrdersPerTable!==false)}<div class="divider"></div><h2>Configured tables</h2><p class="muted small">Rename or change capacity from the Table Management screen. Current tables are saved with this device profile.</p><div class="staff-list">${state.tables.map(t=>`<div class="staff-row"><span style="width:34px;height:34px;border-radius:9px;background:#e7f5ed;color:var(--green);display:grid;place-items:center">${icon('table-cells')}</span><div class="staff-info"><strong>${escapeHtml(t.name)}</strong><small>${escapeHtml(t.section||'Main Dining')} · Capacity ${Number(t.capacity||4)} · ${tableDisplayStatus(t)}</small></div></div>`).join('')}</div>`}
function generalSettings(){return `<h2>Business profile</h2><p>Set the store identity and receipt defaults for this device.</p><div class="field"><label>Business name</label><input id="cfg-store-name" value="${escapeHtml(state.settings.storeName)}" /></div><div class="two-fields"><div class="field"><label>Currency</label><select id="cfg-currency"><option ${state.settings.currency==='PHP'?'selected':''} value="PHP">PHP · Philippine Peso (₱)</option><option ${state.settings.currency==='USD'?'selected':''} value="USD">USD · US Dollar ($)</option></select></div><div class="field"><label>VAT</label><div style="border:1px solid #dfe8e2;border-radius:9px;padding:10px 11px;background:#f4faf6;color:var(--green);font-weight:800">12% included in product prices</div></div></div><div class="divider"></div><h2>Touch & gesture behavior</h2><p>Optional convenience controls for tablet users.</p>${settingToggle('Quick add on product tap','Tap product cards to add directly to the current order.','quickAdd',true)}${settingToggle('Long-press product details','Show product information and modifiers on a long press.','longPress',true)}${settingToggle('Swipe to remove order item','Allow swipe gesture on order lines; a visible remove button remains available.','swipeRemove',true)}${settingToggle('Haptic feedback','Use device haptics where supported.','haptic',false)}`}
function securitySettings(){return `<h2>Security & PINs</h2><p>Configure staff login, approval rules, and automatic screen locking.</p>${settingToggle('Require staff PIN','Staff use a personal PIN after selecting their role.','requirePin',state.settings.requirePin)}<div class="field" style="max-width:300px;margin-top:15px"><label>Auto-lock after inactivity</label><select id="cfg-lock"><option value="1" ${state.settings.lockAfter===1?'selected':''}>1 minute</option><option value="5" ${state.settings.lockAfter===5?'selected':''}>5 minutes</option><option value="10" ${state.settings.lockAfter===10?'selected':''}>10 minutes</option><option value="30" ${state.settings.lockAfter===30?'selected':''}>30 minutes</option></select></div><div class="divider"></div><h2>Manager approval</h2><p>Require approval before sensitive changes or cash actions.</p>${settingToggle('Manager PIN for refunds and voids','Do not allow a cashier to refund or void without approval.','managerRefund',true)}${settingToggle('Manager PIN for negative stock','Allow overselling only with manager permission.','allowNegativeStock',state.settings.allowNegativeStock)}${settingToggle('Manager PIN for manual drawer open','Protect standalone cash-drawer opening.','drawerApproval',true)}${settingToggle('Manager PIN to change staff roles','Only manager may grant or remove staff permissions.','roleApproval',true)}<div class="divider"></div><div class="sync-banner"><i class="fa-solid fa-shield-halved"></i><div><strong>Prototype security note</strong><br>Demo PINs are stored locally in this preview. A production version must use salted server-side PIN hashing, rate limits, lockout, audit logs, and server-enforced role permissions.</div></div><div style="margin-top:16px"><button class="btn btn-primary" data-action="manage-pins">${icon('key')} Manage staff PINs</button></div>`}
function syncSettings(){return `<h2>Google account & device sync</h2><p>Use the same Google account and store on each tablet to keep products, saved orders, kitchen tickets, and stock aligned.</p><div class="sync-banner" style="margin-bottom:18px"><i class="fa-solid fa-cloud-arrow-up"></i><div><strong>Cloud sync is not connected yet</strong><br>This prototype saves demo activity in this browser only. Google OAuth and a secured cloud database must be configured before any device can sync live business data.</div></div><div class="setting-row"><div><strong>Sign-in provider</strong><small>Google sign-in for store owner / manager account</small></div><span class="pill pill-amber">Not connected</span></div><div class="setting-row"><div><strong>Sync policy</strong><small>Event-driven only: publish on Save Order, confirmed payment, kitchen status change, cancellation, or stock adjustment. No per-second polling.</small></div><span class="pill pill-green">Action-triggered</span></div><div class="setting-row"><div><strong>Cross-device cloud sync</strong><small>The event bridge is ready for a cloud adapter; this preview can only relay between same-browser tabs until Google sign-in and a cloud database are connected.</small></div><span class="pill pill-amber">Not connected</span></div><div class="setting-row"><div><strong>Store identifier</strong><small>Devices must share the same store ID to access the same store data.</small></div><strong>mizzy-bistro-demo</strong></div><div class="divider"></div><h2>Connect Google sign-in</h2><p>Required setup: Supabase Auth (Google provider), store membership, row-level security, and event-driven Realtime subscriptions.</p><div class="field"><label>Owner / manager Google account (for setup planning)</label><input id="cfg-owner-email" placeholder="owner@yourbusiness.com" value="${escapeHtml(state.settings.ownerEmail||'')}" /></div><div class="field"><label>Store ID</label><input id="cfg-store-id" value="${escapeHtml(state.settings.storeId||'mizzy-bistro-demo')}" /></div><div class="field"><label>Cloud sync status</label><input value="Not connected — no cloud credentials supplied" disabled /></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" data-action="save-sync-settings">${icon('floppy-disk')} Save setup details</button><button class="btn" data-action="google-setup-guide">${icon('book-open')} View integration checklist</button></div><div class="divider"></div><h2>Device status</h2><div class="stat-line"><span>Local saved state</span><strong>Available</strong></div><div class="stat-line"><span>Current browser</span><strong>Local preview</strong></div><div class="stat-line"><span>Last cloud sync</span><strong>Never</strong></div><div class="footer-note">Do not enter service account secrets into the browser. Only public client configuration belongs in a client app.</div>`}
function modifierSettings(){return `<h2>Products & modifiers</h2><p>Keep modifier pricing active in totals even when price labels are hidden from the staff view.</p>${settingToggle('Hide “+ price” beside modifier options','UI-only display setting. Modifier charges must still be included in cart and receipt totals.','hideModifierPrices',state.settings.hideModifierPrices)}${settingToggle('Save order routes kitchen ticket','Saving a new order sends a kitchen ticket and commits one inventory movement.','autoKitchen',state.settings.autoKitchen)}<div class="divider"></div><h2>Inventory policy</h2>${settingToggle('Allow negative stock with manager approval','Warn if stock is insufficient; manager permission required to continue.','allowNegativeStock',state.settings.allowNegativeStock)}<div class="setting-row"><div><strong>Default starting quantity</strong><small>Initial stock count for imported products.</small></div><strong>10 units</strong></div><div class="setting-row"><div><strong>Imported catalog</strong><small>Loaded from the latest 61-product export, excluding coffee SKUs ICF2–ICF7.</small></div><span class="pill pill-green">61 products</span></div><div class="setting-row"><div><strong>Price / cost values</strong><small>Preserved from your export as supplied.</small></div><span class="pill pill-gray">Unchanged</span></div>`}
function printerSettings(){return `<h2>Printers & receipts</h2><p>Set up a LAN thermal printer and define what appears on customer receipts.</p><div class="setting-row"><div><strong>Thermal printer</strong><small>Network printer, 58 mm or 80 mm paper</small></div><span class="pill pill-amber">Not connected</span></div><div class="two-fields" style="margin-top:15px"><div class="field"><label>Printer name</label><input id="cfg-printer-name" value="${escapeHtml(state.settings.printerName||'Receipt Printer')}" /></div><div class="field"><label>Printer IP address</label><input id="cfg-printer-ip" placeholder="192.168.1.100" value="${escapeHtml(state.settings.printerIp||'')}" /></div></div><div class="two-fields"><div class="field"><label>Port</label><input id="cfg-printer-port" type="number" value="${escapeHtml(state.settings.printerPort||'9100')}" /></div><div class="field"><label>Paper width</label><select id="cfg-paper-width"><option value="58mm" ${state.settings.receiptWidth==='58mm'?'selected':''}>58 mm</option><option value="80mm" ${state.settings.receiptWidth==='80mm'?'selected':''}>80 mm</option></select></div></div><div class="field"><label>Kitchen printer route</label><select id="cfg-kitchen-printer"><option>Same as receipt printer (demo)</option><option>Dedicated kitchen printer</option><option>Kitchen Display System only</option></select></div><div class="divider"></div><h2>Receipt designer</h2>${settingToggle('Show item details','Print each item name, quantity, and modifier.','receiptItems',true)}${settingToggle('Show discounts and tax','Include discount and tax breakdown if present.','receiptTax',true)}${settingToggle('Auto print after confirmed payment','Production only: print after payment confirmation, not before.','autoPrint',false)}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn" data-action="preview-receipt">${icon('receipt')} Preview receipt</button><button class="btn" data-action="printer-test">${icon('print')} Test print</button></div><div class="sync-banner" style="margin-top:14px"><i class="fa-solid fa-circle-info"></i><div>Real LAN printing may require a local print bridge or a native/hardware adapter. This preview cannot verify printer connectivity.</div></div>`}
function shiftSettings(){return `<h2>Shift & cash controls</h2><p>Manage cash drawer behavior for this register.</p>${settingToggle('Allow manual cash drawer opening','Allow staff to open the drawer without recording a sale.','manualDrawer',state.settings.manualDrawer)}${settingToggle('Require a reason for manual drawer open','Record an audit note when the drawer is opened manually.','reasonDrawer',state.settings.reasonDrawer)}${settingToggle('Open drawer automatically for cash sale','Requires compatible cash-drawer hardware.','autoDrawerCash',true)}${settingToggle('Open drawer automatically for cash refund','Cash refunds only; electronic refunds do not open the drawer.','autoDrawerRefund',false)}<div class="footer-note">Only confirmed payments and recorded cash movements affect shift totals.</div>`}
function settingToggle(title,desc,key,checked){return `<div class="setting-row"><div><strong>${title}</strong><small>${desc}</small></div><label class="toggle"><input type="checkbox" data-setting="${key}" ${checked?'checked':''}><span></span></label></div>`}
function loginView(){return `<div class="login-shell"><section class="login-brand"><div class="brand"><div class="brandmark" style="color:var(--green);border-color:#c8e5d4">${icon('store')}</div><div><strong>MY POS</strong><small style="color:#6f8d7b">Simple. Fast. Reliable.</small></div></div><div><div class="eyebrow">Your business, in sync</div><h1>Every shift,<br/><span>running smoother.</span></h1><p>A modern point-of-sale workspace for orders, kitchen operations, inventory, payments, and shift reporting — designed for tablets first.</p><div class="login-features"><span class="feature-chip">${icon('cloud')} Google sign-in & sync</span><span class="feature-chip">${icon('key')} Staff PINs</span><span class="feature-chip">${icon('utensils')} Kitchen routing</span><span class="feature-chip">${icon('boxes-stacked')} Live stock</span></div></div><small style="color:#779284">MY POS · Illustrative interactive prototype</small></section><section class="login-card"><h2>Welcome back</h2><p>Sign in with your store account, or enter a staff PIN to explore the role-specific screens.</p><button class="google-btn" data-action="google-signin"><span class="google-g">G</span> Continue with Google</button><div class="login-separator">OR STAFF PIN</div><div class="field"><label>Staff PIN</label><div class="pin-entry"><input id="login-pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off"/><button class="btn btn-primary" data-action="pin-login">Sign in</button></div><small class="muted">Enter your personal PIN. Your screen access depends on your assigned role.</small></div><div class="divider"></div><strong style="font-size:11px;color:#7b8980">PREVIEW MODE · QUICK ROLE ACCESS</strong><div class="demo-roles"><button class="demo-role" data-demo-role="Kitchen">${icon('utensils')}Kitchen<small class="muted">PIN 4321</small></button><button class="demo-role" data-demo-role="Cashier">${icon('cash-register')}Cashier<small class="muted">PIN 1234</small></button><button class="demo-role" data-demo-role="Manager">${icon('user-gear')}Manager<small class="muted">PIN 2468</small></button></div><p class="demo-note"><strong>Prototype notice:</strong> Google authentication and cross-device cloud sync are not connected yet. Quick role access uses local demo data. Do not use real payment details or sensitive customer information here.</p><div class="footer-note">Build direction 1 · Green & white · Tablet-first · Responsive layout</div></section></div>`}
function bindLogin(){document.querySelector('[data-action="google-signin"]')?.addEventListener('click',()=>showGoogleSetup());document.querySelector('[data-action="pin-login"]')?.addEventListener('click',loginPin);document.querySelectorAll('[data-demo-role]').forEach(b=>b.addEventListener('click',()=>enterRole(b.dataset.demoRole)));document.getElementById('login-pin')?.addEventListener('keydown',e=>{if(e.key==='Enter')loginPin()})}
function loginPin(){const pin=document.getElementById('login-pin')?.value||'';const staff=state.staff.find(s=>s.status==='Active'&&s.pin===pin);if(!staff){toast('PIN not recognized. Try a demo PIN.',false);return}enterRole(staff.role,staff)}
function enterRole(role,staff){state.role=role;state.user=staff?{name:staff.name,email:staff.email,id:staff.id}:{name:role==='Manager'?'Maria Santos':role==='Cashier'?'Alex Reyes':'Jamie Cruz',id:0};state.page=role==='Kitchen'?'Kitchen':role==='Cashier'?'Sell':'Sell';persist();render();toast(`Signed in as ${role}`)}
function logout(){state.role=null;state.user=null;state.page='Sell';render()}
